plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sathipay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sathipay.app'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '1.2.0'
        buildConfigField 'String', 'WEB_APP_URL', '\"' + (project.findProperty('webAppUrl') ?: '') + '\"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
