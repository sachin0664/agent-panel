<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Sathi Pay - Agents</title>

<link
rel="stylesheet"
href="css/style.css"
>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
}

.container{
    padding:20px;
}

.agent-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.agent-header h2{
    margin:0;
}

.add-btn{
    background:#1565c0;
    color:#fff;
    border:0;
    padding:14px 18px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    text-decoration:none;
    display:inline-block;
}

.table-box{
    width:100%;
    overflow-x:auto;
    background:#fff;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.10);
}

.agent-table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

.agent-table th,
.agent-table td{
    padding:14px 12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    white-space:nowrap;
}

.agent-table th{
    background:#e5e7eb;
    color:#1f2937;
    font-weight:bold;
}

.agent-table tr:last-child td{
    border-bottom:0;
}

.uid{
    font-weight:bold;
    color:#1565c0;
    letter-spacing:.5px;
}

.active{
    color:#15803d;
    font-weight:bold;
}

.pending{
    color:#b45309;
    font-weight:bold;
}

.rejected,
.inactive{
    color:#dc2626;
    font-weight:bold;
}

.message{
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    background:#f8fafc;
    font-weight:bold;
}

.empty{
    text-align:center !important;
    padding:30px !important;
    color:#64748b;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .agent-header{
        flex-direction:column;
        align-items:stretch;
    }

    .add-btn{
        text-align:center;
    }

}

</style>

</head>


<body>


<header>

<h1>Sathi Pay - Agents</h1>

<a href="admin.html">
Dashboard
</a>

</header>


<main class="container">


<div class="agent-header">

<h2>👥 Agent List</h2>

<a
href="register.html"
class="add-btn"
>
+ Add New Agent
</a>

</div>


<div
id="message"
class="message"
>
Loading agents...
</div>


<div class="table-box">


<table class="agent-table">


<thead>

<tr>

<th>ID</th>

<th>UID</th>

<th>Agent Name</th>

<th>Mobile</th>

<th>Status</th>

</tr>

</thead>


<tbody id="agentTable">


<tr>

<td
colspan="5"
class="empty"
>
Loading...
</td>

</tr>

</tbody>


</table>


</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================
   UID GENERATOR
================================= */

function generateUID(){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let uid = "SP";

for(let i = 0; i < 8; i++){

uid += chars.charAt(
Math.floor(
Math.random() * chars.length
)
);

}

return uid;

}


/* =================================
   LOAD AGENTS
================================= */

async function loadAgents(){

const message =
document.getElementById("message");

const table =
document.getElementById("agentTable");


message.textContent =
"Loading agents...";

message.style.color =
"#1565c0";


try{


/* GET AGENTS */

const {
data:agents,
error
} =
await supabaseClient

.from("agents")

.select(`
id,
uid,
name,
mobile,
status
`)

.order(
"id",
{
ascending:true
}
);


if(error){

console.error(error);

message.textContent =
"❌ Database error: " +
error.message;

message.style.color =
"#dc2626";

table.innerHTML = `

<tr>

<td
colspan="5"
class="empty"
>
Unable to load agents.
</td>

</tr>

`;

return;

}


if(!agents || agents.length === 0){

message.textContent =
"⚠️ No agents found.";

message.style.color =
"#b45309";

table.innerHTML = `

<tr>

<td
colspan="5"
class="empty"
>
No agents found.
</td>

</tr>

`;

return;

}


/* =================================
   CHECK / CREATE UID
================================= */

for(const agent of agents){

if(
!agent.uid ||
String(agent.uid).trim() === ""
){

let newUID = generateUID();


/* MAKE SURE UID IS UNIQUE */

let uidExists = true;

while(uidExists){

const {
data:existing
} =
await supabaseClient

.from("agents")

.select("id")

.eq("uid",newUID)

.maybeSingle();


if(!existing){

uidExists = false;

}else{

newUID = generateUID();

}

}


/* SAVE UID */

const {
error:updateError
} =
await supabaseClient

.from("agents")

.update({
uid:newUID
})

.eq("id",agent.id);


if(updateError){

console.error(
"UID update error:",
updateError
);

}else{

agent.uid = newUID;

}

}

}


/* =================================
   SHOW AGENTS
================================= */

table.innerHTML =
agents.map(
agent => {

const status =
String(
agent.status || "active"
).toLowerCase();


let statusClass = "active";


if(
status === "pending"
){

statusClass = "pending";

}

if(
status === "rejected"
){

statusClass = "rejected";

}

if(
status === "inactive"
){

statusClass = "inactive";

}


return `

<tr>

<td>
${agent.id ?? "-"}
</td>

<td class="uid">
${agent.uid || "-"}
</td>

<td>
${agent.name || "-"}
</td>

<td>
${agent.mobile || "-"}
</td>

<td class="${statusClass}">
${agent.status || "active"}
</td>

</tr>

`;

}
).join("");


message.textContent =
"✅ " +
agents.length +
" agents loaded successfully.";

message.style.color =
"#15803d";


}catch(error){

console.error(error);

message.textContent =
"❌ Error: " +
error.message;

message.style.color =
"#dc2626";

table.innerHTML = `

<tr>

<td
colspan="5"
class="empty"
>
Something went wrong.
</td>

</tr>

`;

}

}


/* =================================
   START
================================= */

loadAgents();


</script>


</body>

</html>
