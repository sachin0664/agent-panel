<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Agents</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #1f2937;

        }


        .header {

            background: #1f2937;

            color: white;

            padding: 18px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .header h1 {

            margin: 0;

            font-size: 24px;

        }


        .header a {

            color: white;

            text-decoration: none;

        }


        .container {

            max-width: 950px;

            margin: auto;

            padding: 20px;

        }


        .top-section {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .add-btn {

            background: #2563eb;

            color: white;

            border: none;

            padding: 12px 18px;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

        }


        .agent-form {

            display: none;

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 6px;

        }


        input,
        select {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

        }


        .save-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #16a34a;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        #agentMessage {

            text-align: center;

            margin-top: 10px;

            font-weight: bold;

        }


        .table-box {

            background: white;

            overflow-x: auto;

            border-radius: 12px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 650px;

        }


        th,
        td {

            padding: 15px;

            text-align: left;

            border-bottom: 1px solid #ddd;

        }


        th {

            background: #e5e7eb;

        }


        .active {

            color: green;

            font-weight: bold;

        }


        .inactive {

            color: red;

            font-weight: bold;

        }


        .delete-btn {

            background: #dc2626;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

        }


    </style>

</head>


<body>


    <div class="header">

        <h1>Sathi Pay - Agents</h1>

        <a href="admin.html">
            Dashboard
        </a>

    </div>



    <div class="container">


        <div class="top-section">

            <h2>Agent List</h2>

            <button
                class="add-btn"
                onclick="showAgentForm()"
            >
                + Add New Agent
            </button>

        </div>



        <!-- ADD AGENT FORM -->

        <div
            class="agent-form"
            id="agentForm"
        >

            <h2>Add New Agent</h2>


            <form onsubmit="addAgent(event)">


                <label>Agent Name</label>

                <input
                    type="text"
                    id="agentName"
                    placeholder="Enter agent name"
                    required
                >



                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="agentMobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    required
                >



                <label>Status</label>

                <select id="agentStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>



                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Agent
                </button>


                <div id="agentMessage"></div>


            </form>

        </div>



        <!-- AGENT TABLE -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Agent Name</th>

                        <th>Mobile</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="agentTable">

                    <tr>

                        <td colspan="5">

                            Loading agents...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>



    <!-- SUPABASE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- YOUR JAVASCRIPT -->

    <script src="js/app.js"></script>


    <!-- LOAD DATA -->

    <script>

        loadAgents();

    </script>


</body>

    </html>
