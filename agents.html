<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sathi Pay - Agents</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .agent-form {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #e5e7eb;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .top-section {
                flex-direction: column;
                align-items: stretch;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Agents</h1>
        <a href="admin.html">Dashboard</a>
    </div>


    <div class="container">

        <div class="top-section">
            <h2>Agent List</h2>

            <button class="add-btn" onclick="showAgentForm()">
                + Add New Agent
            </button>
        </div>


        <div class="agent-form" id="agentForm">

            <h2>Add New Agent</h2>

            <form onsubmit="addAgent(event)">

                <label>Agent Name</label>

                <input
                    type="text"
                    id="agentName"
                    placeholder="Enter agent name"
                    required
                >

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="agentMobile"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required
                >

                <label>Status</label>

                <select id="agentStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <button type="submit" class="save-btn">
                    Save Agent
                </button>

            </form>

        </div>


        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Agent Name</th>
                        <th>Mobile</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="agentTable"></tbody>

            </table>

        </div>

    </div>


<script>

    // Default Agents
    const defaultAgents = [
        {
            id: "001",
            name: "Agent One",
            mobile: "9876543210",
            status: "Active"
        },
        {
            id: "002",
            name: "Agent Two",
            mobile: "9876543211",
            status: "Active"
        },
        {
            id: "003",
            name: "Agent Three",
            mobile: "9876543212",
            status: "Inactive"
        }
    ];


    // Get Agents from LocalStorage
    function getAgents() {

        const savedAgents = localStorage.getItem("agents");

        if (savedAgents) {
            return JSON.parse(savedAgents);
        }

        localStorage.setItem(
            "agents",
            JSON.stringify(defaultAgents)
        );

        return defaultAgents;
    }


    // Save Agents
    function saveAgents(agents) {

        localStorage.setItem(
            "agents",
            JSON.stringify(agents)
        );
    }


    // Show Agents
    function displayAgents() {

        const agents = getAgents();

        const table = document.getElementById("agentTable");

        table.innerHTML = "";

        agents.forEach(function(agent) {

            const statusClass =
                agent.status === "Active"
                    ? "active"
                    : "inactive";

            table.innerHTML += `
                <tr>
                    <td>${agent.id}</td>
                    <td>${agent.name}</td>
                    <td>${agent.mobile}</td>

                    <td class="${statusClass}">
                        ${agent.status}
                    </td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteAgent('${agent.id}')"
                        >
                            Delete
                        </button>
                    </td>
                </tr>
            `;

        });

    }


    // Show / Hide Form
    function showAgentForm() {

        const form = document.getElementById("agentForm");

        if (form.style.display === "block") {
            form.style.display = "none";
        } else {
            form.style.display = "block";
        }
    }


    // Add Agent
    function addAgent(event) {

        event.preventDefault();

        const name =
            document.getElementById("agentName").value.trim();

        const mobile =
            document.getElementById("agentMobile").value.trim();

        const status =
            document.getElementById("agentStatus").value;


        if (mobile.length !== 10) {
            alert("Please enter a valid 10 digit mobile number.");
            return;
        }


        const agents = getAgents();


        // Generate ID
        const newId = String(
            agents.length + 1
        ).padStart(3, "0");


        const newAgent = {
            id: newId,
            name: name,
            mobile: mobile,
            status: status
        };


        agents.push(newAgent);

        saveAgents(agents);

        displayAgents();


        // Reset Form
        document.getElementById("agentName").value = "";
        document.getElementById("agentMobile").value = "";
        document.getElementById("agentStatus").value = "Active";


        document.getElementById("agentForm").style.display = "none";

        alert("Agent added successfully!");

    }


    // Delete Agent
    function deleteAgent(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this agent?");

        if (!confirmDelete) {
            return;
        }


        let agents = getAgents();

        agents = agents.filter(function(agent) {
            return agent.id !== id;
        });


        saveAgents(agents);

        displayAgents();

    }


    // Load Agents when page opens
    displayAgents();

</script>

</body>
</html>
