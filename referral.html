<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sathi Pay - Referral</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #202938;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

.rate {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.summary {
    text-align: center;
    font-size: 18px;
}

.number {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.history-item {
    background: #f8fafc;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 8px;
    border-left: 4px solid #2563eb;
}

.message {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
}

</style>

</head>


<body>

<header>
    Sathi Pay
</header>


<div class="container">


    <!-- REFERRAL LINK -->

    <div class="card">

        <h2>Referral Link</h2>

        <input
            type="text"
            id="referralLink"
            readonly
        >

        <button onclick="copyReferral()">
            Copy Referral Link
        </button>

        <div
            id="message"
            class="message">
        </div>

    </div>


    <!-- LEVEL RATES -->

    <div class="card">

        <h2>Referral Commission</h2>

        <div class="rate">
            Level A — 1%
        </div>

        <div class="rate">
            Level B — 0.5%
        </div>

        <div class="rate">
            Level C — 0.2%
        </div>

        <p>
            Approved deposits par referral commission
            automatically calculate hoga.
        </p>

    </div>


    <!-- SUMMARY -->

    <div class="card summary">

        <h2>📊 Referral Summary</h2>

        <p>Total Referrals</p>

        <div
            id="totalReferrals"
            class="number">
            0
        </div>

        <br>

        <p>Referral Commission</p>

        <div
            id="totalCommission"
            class="number">
            ₹0.00
        </div>

    </div>


    <!-- HISTORY -->

    <div class="card">

        <h2>👥 Referral History</h2>

        <div id="history">
            Loading...
        </div>

    </div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
    "https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   REFERRAL LINK
========================= */

function createReferralLink() {

    const baseUrl =
        window.location.origin +
        window.location.pathname
            .replace("referral.html", "");

    const referralCode =
        localStorage.getItem("referralCode") ||
        "SATHIPAY";

    const link =
        baseUrl +
        "register.html?ref=" +
        referralCode;

    document.getElementById("referralLink").value =
        link;
}


function copyReferral() {

    const input =
        document.getElementById("referralLink");

    navigator.clipboard.writeText(input.value)
        .then(function() {

            document.getElementById("message").innerText =
                "Referral link copied successfully!";

        })
        .catch(function() {

            input.select();

            document.execCommand("copy");

            document.getElementById("message").innerText =
                "Referral link copied successfully!";

        });

}


/* =========================
   GET LOGIN UID
========================= */

function getLoginUID() {

    const possibleKeys = [

        "sathiPayUID",
        "agentUID",
        "uid",
        "UID",
        "sathi_pay_uid",
        "userUID",
        "userUid"

    ];

    for (const key of possibleKeys) {

        const value =
            localStorage.getItem(key);

        if (
            value &&
            value.trim() !== ""
        ) {

            return value.trim();

        }

    }

    return null;
}


/* =========================
   LOAD REFERRAL DATA
========================= */

async function loadReferralData() {

    const history =
        document.getElementById("history");

    const totalReferrals =
        document.getElementById("totalReferrals");

    const totalCommission =
        document.getElementById("totalCommission");


    const loginUID =
        getLoginUID();


    if (!loginUID) {

        history.innerText =
            "Please login again.";

        return;
    }


    /* FIND AGENT BY UID */

    const { data: agents, error: agentError } =
        await supabaseClient
        .from("agents")
        .select("id, uid, name, mobile")
        .ilike("uid", loginUID);


    if (agentError) {

        console.error(agentError);

        history.innerText =
            "Agent account loading error.";

        return;
    }


    if (!agents || agents.length === 0) {

        history.innerText =
            "Agent account not found.";

        return;
    }


    const agent =
        agents[0];


    /* LOAD REFERRAL COMMISSIONS */

    const {
        data: commissions,
        error: commissionError
    } =
        await supabaseClient
        .from("referral_commissions")
        .select(`
            id,
            agent_id,
            source_agent_id,
            level,
            rate,
            amount,
            deposit_id,
            status,
            created_at
        `)
        .eq("agent_id", agent.id)
        .order("id", {
            ascending: false
        });


    if (commissionError) {

        console.error(commissionError);

        history.innerText =
            "Referral data loading error.";

        return;
    }


    const rows =
        commissions || [];


    /* TOTAL COMMISSION */

    const commission =
        rows.reduce(
            function(sum, row) {

                return sum +
                    Number(row.amount || 0);

            },
            0
        );


    totalCommission.innerText =
        "₹" + commission.toFixed(2);


    /* TOTAL UNIQUE REFERRALS */

    const referralAgents =
        new Set();

    rows.forEach(function(row) {

        if (row.source_agent_id) {

            referralAgents.add(
                row.source_agent_id
            );

        }

    });


    totalReferrals.innerText =
        referralAgents.size;


    /* NO DATA */

    if (rows.length === 0) {

        history.innerText =
            "No referral commission found.";

        return;
    }


    /* HISTORY */

    history.innerHTML =
        rows.map(function(row) {

            return `
                <div class="history-item">

                    <b>
                        Level ${row.level}
                    </b>

                    <br><br>

                    Rate:
                    ${Number(row.rate || 0).toFixed(2)}%

                    <br>

                    Commission:
                    <b>
                        ₹${Number(row.amount || 0).toFixed(2)}
                    </b>

                    <br>

                    Deposit ID:
                    ${row.deposit_id || "-"}

                    <br>

                    Status:
                    ${row.status || "-"}

                </div>
            `;

        }).join("");

}


/* =========================
   START
========================= */

createReferralLink();

loadReferralData();

</script>


</body>

    </html>
