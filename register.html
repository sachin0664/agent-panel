<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathi Pay - Register</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 430px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .otp-box {
      display: none;
      margin-top: 20px;
    }

    .ref-box {
      display: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #1e40af;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Sathi Pay</h1>
      <div class="subtitle">Create your account</div>

      <div id="refBox" class="ref-box">
        Referral Code:
        <span id="refCodeText"></span>
      </div>

      <form id="registerForm">

        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label>Mobile Number</label>
        <input
          type="tel"
          id="mobile"
          placeholder="Enter 10 digit mobile number"
          maxlength="10"
          inputmode="numeric"
          required
        >

        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter email"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create password"
          minlength="6"
          required
        >

        <button type="submit">
          Send OTP
        </button>

      </form>

      <div id="otpBox" class="otp-box">

        <label>Enter OTP</label>

        <input
          type="text"
          id="otp"
          placeholder="Enter 6 digit OTP"
          maxlength="6"
          inputmode="numeric"
        >

        <button type="button" id="verifyBtn">
          Verify OTP & Register
        </button>

      </div>

      <div id="message" class="message"></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </div>
  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================================
       SUPABASE CONFIGURATION
       ========================================= */

    const SUPABASE_URL =
      "https://lozluohksmjxbxixkbmq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       REFERRAL CODE
       ========================================= */

    const urlParams =
      new URLSearchParams(window.location.search);

    const referralCode =
      urlParams.get("ref") || "";

    if (referralCode) {

      document.getElementById("refBox").style.display =
        "block";

      document.getElementById("refCodeText").textContent =
        referralCode;

      localStorage.setItem(
        "sathi_referral_code",
        referralCode
      );
    }


    /* =========================================
       OTP VARIABLE
       ========================================= */

    let generatedOTP = "";


    /* =========================================
       SEND OTP
       ========================================= */

    document
      .getElementById("registerForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value.trim();

        const mobile =
          document.getElementById("mobile").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        if (!/^[0-9]{10}$/.test(mobile)) {

          showMessage(
            "Please enter a valid 10 digit mobile number.",
            "red"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "red"
          );

          return;
        }


        /* Generate Demo OTP */

        generatedOTP =
          Math.floor(
            100000 + Math.random() * 900000
          ).toString();


        /* Save temporary registration data */

        localStorage.setItem(
          "sathi_temp_name",
          name
        );

        localStorage.setItem(
          "sathi_temp_mobile",
          mobile
        );

        localStorage.setItem(
          "sathi_temp_email",
          email
        );

        localStorage.setItem(
          "sathi_temp_password",
          password
        );


        /* Show OTP box */

        document.getElementById("otpBox").style.display =
          "block";


        showMessage(
          "Demo OTP: " + generatedOTP,
          "green"
        );

      });


    /* =========================================
       VERIFY OTP & CREATE ACCOUNT
       ========================================= */

    document
      .getElementById("verifyBtn")
      .addEventListener("click", async function() {

        const enteredOTP =
          document.getElementById("otp").value.trim();


        if (!enteredOTP) {

          showMessage(
            "Please enter OTP.",
            "red"
          );

          return;
        }


        if (enteredOTP !== generatedOTP) {

          showMessage(
            "Wrong OTP. Please enter the correct OTP.",
            "red"
          );

          return;
        }


        const name =
          localStorage.getItem("sathi_temp_name");

        const mobile =
          localStorage.getItem("sathi_temp_mobile");

        const email =
          localStorage.getItem("sathi_temp_email");

        const password =
          localStorage.getItem("sathi_temp_password");


        showMessage(
          "Creating your account...",
          "blue"
        );


        /* =========================================
           CHECK EXISTING MOBILE
           ========================================= */

        const {
          data: existingAgent,
          error: checkError
        } = await supabaseClient
          .from("agents")
          .select("id, mobile")
          .eq("mobile", mobile)
          .maybeSingle();


        if (checkError) {

          console.error(checkError);

          showMessage(
            "Database error: " +
            checkError.message,
            "red"
          );

          return;
        }


        if (existingAgent) {

          showMessage(
            "This mobile number is already registered.",
            "red"
          );

          return;
        }


        /* =========================================
           GENERATE UNIQUE REFERRAL CODE
           ========================================= */

        const newReferralCode =
          "SP" +
          Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


        /* =========================================
           FIND REFERRER
           ========================================= */

        let referredBy = null;

        const savedReferralCode =
          localStorage.getItem(
            "sathi_referral_code"
          );


        if (savedReferralCode) {

          const {
            data: referrer,
            error: refError
          } = await supabaseClient
            .from("agents")
            .select("id, referral_code")
            .eq(
              "referral_code",
              savedReferralCode
            )
            .maybeSingle();


          if (!refError && referrer) {

            referredBy =
              savedReferralCode;

          }
        }


        /* =========================================
           CREATE AGENT
           ========================================= */

        const {
          data: newAgent,
          error: insertError
        } = await supabaseClient
          .from("agents")
          .insert([{

            name: name,

            mobile: mobile,

            status: "Active",

            referral_code:
              newReferralCode,

            referred_by:
              referredBy,

            password_hash:
              password

          }])
          .select()
          .single();


        if (insertError) {

          console.error(insertError);

          showMessage(
            "Registration failed: " +
            insertError.message,
            "red"
          );

          return;
        }


        /* =========================================
           SAVE USER INFORMATION
           ========================================= */

        localStorage.setItem(
          "sathi_registered",
          "true"
        );

        localStorage.setItem(
          "sathi_name",
          name
        );

        localStorage.setItem(
          "sathi_mobile",
          mobile
        );

        localStorage.setItem(
          "sathi_email",
          email
        );

        localStorage.setItem(
          "sathi_agent_id",
          newAgent.id
        );

        localStorage.setItem(
          "sathi_my_referral_code",
          newReferralCode
        );


        /* =========================================
           CLEAN TEMP DATA
           ========================================= */

        localStorage.removeItem(
          "sathi_temp_name"
        );

        localStorage.removeItem(
          "sathi_temp_mobile"
        );

        localStorage.removeItem(
          "sathi_temp_email"
        );

        localStorage.removeItem(
          "sathi_temp_password"
        );


        /* =========================================
           SUCCESS
           ========================================= */

        showMessage(
          "Registration successful!",
          "green"
        );


        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 1500);

      });


    /* =========================================
       MESSAGE FUNCTION
       ========================================= */

    function showMessage(text, color) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.style.color = color;

    }

  </script>

</body>
  </html>
