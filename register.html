<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathi Pay - Register</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .register-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 22px;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 17px;
      font-weight: bold;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 17px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="register-page">
    <div class="register-box">

      <div class="logo">Sathi Pay</div>

      <div class="subtitle">Agent Registration</div>

      <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter mobile number" required>

        <label>Email</label>
        <input type="email" placeholder="Enter email address" required>

        <label>Password</label>
        <input type="password" placeholder="Create password" required>

        <button type="submit">Register</button>
      </form>

      <div class="login-link">
        Already registered?
        <a href="login.html">Login</a>
      </div>

    </div>
  </div>

</body>
          </html>
