<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathi Pay - Register</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .register-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 22px;
      color: #666;
      margin-bottom: 30px;
    }

    .referral-box {
      display: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      color: #1d4ed8;
      font-weight: bold;
    }

    label {
      display: block;
      font-size: 17px;
      font-weight: bold;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 17px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    #otpSection {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .back-btn {
      background: #e5e7eb;
      color: #111827;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="register-page">
  <div class="register-box">

    <div class="logo">Sathi Pay</div>
    <div class="subtitle">Agent Registration</div>

    <div id="referralBox" class="referral-box">
      Referral Code: <span id="referralCodeText"></span>
    </div>

    <form id="registerForm">

      <label>Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <label>Mobile Number</label>
      <input
        type="tel"
        id="mobile"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter email address"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create password"
        minlength="6"
        required
      >

      <button type="submit" id="sendOtpBtn">
        Send OTP
      </button>

    </form>

    <div id="otpSection">

      <label>Enter OTP</label>

      <input
        type="text"
        id="otp"
        placeholder="Enter 6 digit OTP"
        maxlength="6"
        inputmode="numeric"
      >

      <button onclick="verifyOTP()">
        Verify OTP
      </button>

      <button class="back-btn" onclick="goBack()">
        Change Mobile Number
      </button>

      <div class="message" id="otpMessage"></div>

    </div>

    <div class="login-link">
      Already registered?
      <a href="login.html">Login</a>
    </div>

  </div>
</div>
