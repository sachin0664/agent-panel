<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Sathi Pay - Link UPI</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#0f172a;
  padding-bottom:92px
}

.header{
  padding:22px 18px 12px;
  text-align:center;
  background:#f4f6fb
}

.header h1{
  margin:0;
  font-size:28px
}

.container{
  max-width:520px;
  margin:auto;
  padding:12px 16px 30px
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#1768f5,#315ee8);
  color:#fff;
  border-radius:22px;
  padding:22px 20px;
  margin-bottom:16px;
  box-shadow:0 10px 24px rgba(37,99,235,.22)
}

.card:after{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  right:-70px;
  top:-50px;
  background:rgba(255,255,255,.10)
}

.row{
  position:relative;
  z-index:1
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.upi-title{
  font-size:31px;
  font-weight:800
}

.status{
  padding:8px 15px;
  border-radius:20px;
  background:#16a34a;
  border:2px solid #fff;
  font-weight:700;
  cursor:pointer;
  user-select:none
}

.status.off{
  background:#ef4444
}

.upi{
  font-size:17px;
  margin-top:6px;
  word-break:break-all
}

.meta{
  margin-top:18px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.13);
  border-radius:15px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:14px;
  flex-wrap:wrap
}

.meta span{
  word-break:break-word
}

.empty{
  background:#fff;
  border-radius:18px;
  padding:24px;
  text-align:center;
  color:#64748b;
  margin-bottom:16px
}

.add{
  display:block;
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:#07101d;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer
}

.add:disabled{
  opacity:.5;
  cursor:not-allowed
}

.limit-note{
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin:-7px 0 16px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:20;
  padding:18px;
  align-items:flex-end
}

.sheet{
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:22px;
  width:100%;
  max-width:520px;
  margin:auto
}

.sheet h2{
  margin:0 0 16px
}

.field{
  margin-bottom:13px
}

.field label{
  display:block;
  font-size:13px;
  color:#64748b;
  margin-bottom:6px
}

.field input,
.field select{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:12px;
  font-size:15px
}

.actions{
  display:flex;
  gap:10px
}

.actions button{
  flex:1;
  padding:14px;
  border:0;
  border-radius:12px;
  font-weight:700;
  cursor:pointer
}

.cancel{
  background:#e5e7eb
}

.save{
  background:#2563eb;
  color:#fff
}

.msg{
  font-size:13px;
  margin-top:10px;
  min-height:18px;
  word-break:break-word
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:10
}

.bottom-nav a{
  text-decoration:none;
  color:#94a3b8;
  text-align:center;
  font-size:12px
}

.bottom-nav .plus{
  width:66px;
  height:66px;
  border-radius:50%;
  background:#1768f5;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  line-height:1;
  box-shadow:0 6px 18px rgba(37,99,235,.3);
  margin-top:-30px
}

.bottom-nav span{
  display:block;
  font-size:24px;
  margin-bottom:2px
}

</style>

</head>

<body>


<header class="header">

  <h1>Link UPI</h1>

</header>


<main class="container">

  <div id="upiList"></div>


  <div
    class="empty"
    id="emptyState"
    style="display:none"
  >

    No UPI linked yet.<br>

    Add your UPI ID below.

  </div>


  <div
    class="limit-note"
    id="limitNote"
  >
    You can add up to 3 UPI IDs.
  </div>


  <button
    class="add"
    id="addBtn"
    type="button"
  >

    Add UPI

  </button>

</main>


<div
  class="modal"
  id="modal"
>

  <div class="sheet">

    <h2>Add UPI</h2>


    <form id="upiForm">


      <div class="field">

        <label>Provider</label>

        <select
          id="provider"
          required
        >

          <option value="">
            Select Provider
          </option>

          <option>Paytm</option>

          <option>Navi</option>

          <option>PhonePe</option>

          <option>Google Pay</option>

          <option>MobiKwik</option>

          <option>Other</option>

        </select>

      </div>


      <div class="field">

        <label>UPI ID</label>

        <input
          id="upi"
          type="text"
          inputmode="email"
          autocomplete="off"
          placeholder="example@upi"
          maxlength="100"
          required
        >

      </div>


      <div class="field">

        <label>
          Payin Minimum (₹)
        </label>

        <input
          id="min"
          type="number"
          min="1"
          step="0.01"
          value="50"
          required
        >

      </div>


      <div class="field">

        <label>
          Payin Maximum (₹)
        </label>

        <input
          id="max"
          type="number"
          min="1"
          step="0.01"
          value="1000000"
          required
        >

      </div>


      <div class="actions">

        <button
          class="cancel"
          type="button"
          id="cancelBtn"
        >

          Cancel

        </button>


        <button
          class="save"
          type="submit"
        >

          Save UPI

        </button>

      </div>


      <div
        class="msg"
        id="msg"
      ></div>


    </form>

  </div>

</div>


<nav class="bottom-nav">


  <a href="dashboard.html">

    <span>⌂</span>

    Home

  </a>


  <a href="deposit.html">

    <span>▣</span>

    Deposit

  </a>


  <a href="link-upi.html">

    <span class="plus">+</span>

  </a>


  <a href="referral.html">

    <span>♕</span>

    Team

  </a>


  <a href="wallet.html">

    <span>◉</span>

    Assets

  </a>


</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=8"></script>


<script>

/* =====================================
   SATHI PAY — MULTI UPI
   Maximum 3 UPI
   Customer:
   ADD / ENABLE / DISABLE
   NO DELETE
===================================== */


/* =====================================
   ELEMENTS
===================================== */

const list =
  document.getElementById('upiList');

const empty =
  document.getElementById('emptyState');

const modal =
  document.getElementById('modal');

const msg =
  document.getElementById('msg');

const addBtn =
  document.getElementById('addBtn');

const limitNote =
  document.getElementById('limitNote');


let customerId = null;

let currentUPIs = [];


/* =====================================
   GET AUTH CUSTOMER ID
===================================== */

async function getCustomerId(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();


  if(
    error ||
    !data ||
    !data.user
  ){

    window.location.href =
      'customer-login.html';

    return null;
  }


  customerId =
    data.user.id;


  localStorage.setItem(
    'sathiPayCustomerId',
    customerId
  );


  return customerId;

}


/* =====================================
   ESCAPE HTML
===================================== */

function esc(v){

  return String(
    v ?? ''
  ).replace(
    /[&<>"']/g,

    c => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#39;'

    }[c])

  );

}


/* =====================================
   FORMAT MONEY
===================================== */

function money(v){

  const n =
    Number(v);

  if(
    !Number.isFinite(n)
  ){

    return '0.00';

  }

  return n.toFixed(2);

}


/* =====================================
   MIGRATE OLD SINGLE UPI
   customers table
   ->
   customer_upis table
===================================== */

async function migrateOldUPI(id){

  try{

    /* Check if new table already has UPI */

    const {
      data: existing,
      error: existingError
    } =
      await supabaseClient

        .from('customer_upis')

        .select('id,upi_id')

        .eq(
          'customer_id',
          id
        );


    if(existingError){

      console.error(
        'New UPI table check error:',
        existingError
      );

      return;

    }


    /* If new UPI already exists,
       do not migrate old record again */

    if(
      existing &&
      existing.length > 0
    ){

      return;

    }


    /* Get old UPI */

    const {
      data: oldData,
      error: oldError
    } =
      await supabaseClient

        .from('customers')

        .select(
          'id,upi_id,upi_provider,upi_enabled,upi_min_amount,upi_max_amount'
        )

        .eq(
          'id',
          id
        )

        .maybeSingle();


    if(oldError){

      console.error(
        'Old UPI read error:',
        oldError
      );

      return;

    }


    if(
      !oldData ||
      !oldData.upi_id
    ){

      return;

    }


    /* Insert old UPI
       into new table */

    const {
      error: insertError
    } =
      await supabaseClient

        .from('customer_upis')

        .insert({

          customer_id:
            id,

          upi_id:
            String(
              oldData.upi_id
            )
            .trim()
            .toLowerCase(),

          provider:
            oldData.upi_provider ||
            'Other',

          enabled:
            oldData.upi_enabled !== false,

          min_amount:
            Number(
              oldData.upi_min_amount ||
              50
            ),

          max_amount:
            Number(
              oldData.upi_max_amount ||
              1000000
            )

        });


    if(insertError){

      /*
       * Duplicate / already migrated
       * is harmless.
       */

      console.warn(
        'Old UPI migration:',
        insertError
      );

      return;

    }


    console.log(
      'Old UPI migrated successfully.'
    );

  }
  catch(error){

    console.error(
      'UPI migration error:',
      error
    );

  }

}


/* =====================================
   LOAD ALL UPIs
===================================== */

async function loadUPI(){

  const id =
    await getCustomerId();


  if(!id){

    return;

  }


  /* Automatically preserve
     existing working UPI */

  await migrateOldUPI(id);


  /* Get maximum 3 */

  const {
    data,
    error
  } =
    await supabaseClient

      .from('customer_upis')

      .select(
        'id,customer_id,upi_id,provider,enabled,min_amount,max_amount,created_at,updated_at'
      )

      .eq(
        'customer_id',
        id
      )

      .order(
        'created_at',
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      'UPI Load Error:',
      error
    );


    list.innerHTML =
      '<div class="empty">Load Error: ' +
      esc(
        error.message ||
        'Unknown error'
      ) +
      '</div>';


    empty.style.display =
      'none';

    return;

  }


  currentUPIs =
    Array.isArray(data)
      ? data
      : [];


  renderUPIs();

}


/* =====================================
   RENDER UPI CARDS
===================================== */

function renderUPIs(){

  list.innerHTML =
    '';


  if(
    currentUPIs.length === 0
  ){

    empty.style.display =
      'block';

  }
  else{

    empty.style.display =
      'none';

  }


  /* Maximum 3 */

  const visibleUPIs =
    currentUPIs.slice(
      0,
      3
    );


  visibleUPIs.forEach(
    (item,index) => {

      const enabled =
        item.enabled !== false;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      card.innerHTML = `

        <div class="row">

          <div class="top">

            <div class="upi-title">

              UPI ${index + 1}

            </div>


            <div
              class="status ${
                enabled ? '' : 'off'
              }"
              data-id="${esc(item.id)}"
              role="button"
              tabindex="0"
              title="Tap to ${
                enabled
                  ? 'disable'
                  : 'enable'
              }"
            >

              ${
                enabled
                  ? 'Enabled'
                  : 'Disabled'
              }

            </div>

          </div>


          <div class="upi">

            ${esc(item.upi_id)}

          </div>


          <div class="meta">

            <span>

              Payin:

              ₹${money(item.min_amount)}

              ~

              ₹${money(item.max_amount)}

            </span>


            <span>

              ${esc(
                item.provider ||
                'Other'
              )}

            </span>

          </div>

        </div>

      `;


      list.appendChild(
        card
      );


      const status =
        card.querySelector(
          '.status'
        );


      status.addEventListener(
        'click',
        () => {

          toggleUPI(
            item.id,
            enabled
          );

        }
      );


      status.addEventListener(
        'keydown',
        event => {

          if(
            event.key === 'Enter' ||
            event.key === ' '
          ){

            event.preventDefault();

            toggleUPI(
              item.id,
              enabled
            );

          }

        }
      );

    }
  );


  updateAddButton();

}


/* =====================================
   ADD BUTTON / 3 UPI LIMIT
===================================== */

function updateAddButton(){

  const count =
    currentUPIs.length;


  if(
    count >= 3
  ){

    addBtn.disabled =
      true;

    addBtn.textContent =
      'Maximum 3 UPI Added';

    limitNote.textContent =
      'Maximum 3 UPI IDs allowed.';

  }
  else{

    addBtn.disabled =
      false;

    addBtn.textContent =
      'Add UPI';

    limitNote.textContent =
      `${count}/3 UPI IDs added.`;

  }

}


/* =====================================
   ENABLE / DISABLE UPI
===================================== */

async function toggleUPI(
  upiRowId,
  currentEnabled
){

  if(!upiRowId){

    return;

  }


  const nextEnabled =
    !currentEnabled;


  /* Find card status */

  const status =
    document.querySelector(
      `.status[data-id="${CSS.escape(upiRowId)}"]`
    );


  if(status){

    status.style.pointerEvents =
      'none';

    status.textContent =
      'Saving...';

  }


  const {
    error
  } =
    await supabaseClient

      .from('customer_upis')

      .update({

        enabled:
          nextEnabled,

        updated_at:
          new Date().toISOString()

      })

      .eq(
        'id',
        upiRowId
      )

      .eq(
        'customer_id',
        customerId
      );


  if(error){

    console.error(
      'UPI Status Error:',
      error
    );


    alert(
      'Unable to change UPI status: ' +
      (
        error.message ||
        'Unknown error'
      )
    );


    if(status){

      status.style.pointerEvents =
        '';

    }


    return;

  }


  await loadUPI();

}


/* =====================================
   OPEN ADD MODAL
===================================== */

addBtn.onclick = () => {

  if(
    currentUPIs.length >= 3
  ){

    return;

  }


  msg.textContent =
    '';

  msg.style.color =
    '#dc2626';


  document
    .getElementById('upiForm')
    .reset();


  document
    .getElementById('min')
    .value =
    50;


  document
    .getElementById('max')
    .value =
    1000000;


  modal.style.display =
    'flex';

};


/* =====================================
   CANCEL
===================================== */

document.getElementById(
  'cancelBtn'
).onclick = () => {

  modal.style.display =
    'none';

};


/* =====================================
   CLOSE MODAL ON BACKGROUND
===================================== */

modal.addEventListener(
  'click',
  event => {

    if(
      event.target === modal
    ){

      modal.style.display =
        'none';

    }

  }
);


/* =====================================
   SAVE NEW UPI
===================================== */

document.getElementById(
  'upiForm'
).onsubmit = async e => {

  e.preventDefault();


  msg.style.color =
    '#dc2626';

  msg.textContent =
    '';


  /* Extra frontend limit */

  if(
    currentUPIs.length >= 3
  ){

    msg.textContent =
      'Maximum 3 UPI IDs allowed.';

    return;

  }


  const upi =
    document
      .getElementById('upi')
      .value
      .trim()
      .toLowerCase();


  const provider =
    document
      .getElementById('provider')
      .value;


  const min =
    Number(
      document
        .getElementById('min')
        .value
    );


  const max =
    Number(
      document
        .getElementById('max')
        .value
    );


  /* =================================
     VALIDATION
  ================================= */

  if(
    !/^[^\s@]+@[^\s@]+$/.test(upi)
  ){

    msg.textContent =
      'Enter a valid UPI ID.';

    return;

  }


  if(!provider){

    msg.textContent =
      'Select a provider.';

    return;

  }


  if(
    !Number.isFinite(min) ||
    !Number.isFinite(max) ||
    min <= 0 ||
    max < min
  ){

    msg.textContent =
      'Check the payin range.';

    return;

  }


  /* =================================
     GET REAL AUTH USER
  ================================= */

  const {
    data: authData,
    error: authError
  } =
    await supabaseClient.auth.getUser();


  if(
    authError ||
    !authData ||
    !authData.user
  ){

    window.location.href =
      'customer-login.html';

    return;

  }


  customerId =
    authData.user.id;


  /* =================================
     FINAL COUNT CHECK
  ================================= */

  const {
    data: latestUPIs,
    error: countError
  } =
    await supabaseClient

      .from('customer_upis')

      .select(
        'id'
      )

      .eq(
        'customer_id',
        customerId
      );


  if(countError){

    msg.textContent =
      'Unable to verify UPI limit: ' +
      (
        countError.message ||
        'Unknown error'
      );

    return;

  }


  if(
    latestUPIs &&
    latestUPIs.length >= 3
  ){

    msg.textContent =
      'Maximum 3 UPI IDs allowed.';

    await loadUPI();

    return;

  }


  /* =================================
     DUPLICATE CHECK
  ================================= */

  const duplicate =
    (latestUPIs || []).some(
      item =>
        String(
          item.upi_id ||
          ''
        )
        .trim()
        .toLowerCase() === upi
    );


  /*
   * The database unique index is the
   * final protection. This frontend
   * check gives a better message.
   *
   * Since latestUPIs only selected id
   * above, perform proper duplicate
   * lookup separately.
   */

  const {
    data: duplicateRows,
    error: duplicateError
  } =
    await supabaseClient

      .from('customer_upis')

      .select(
        'id,upi_id'
      )

      .eq(
        'customer_id',
        customerId
      );


  if(duplicateError){

    msg.textContent =
      'Unable to check duplicate UPI.';

    return;

  }


  const alreadyExists =
    (duplicateRows || []).some(
      row =>
        String(
          row.upi_id ||
          ''
        )
        .trim()
        .toLowerCase() === upi
    );


  if(alreadyExists){

    msg.textContent =
      'This UPI ID is already linked.';

    return;

  }


  /* =================================
     INSERT NEW UPI
  ================================= */

  const {
    data,
    error
  } =
    await supabaseClient

      .from('customer_upis')

      .insert({

        customer_id:
          customerId,

        upi_id:
          upi,

        provider:
          provider,

        enabled:
          true,

        min_amount:
          min,

        max_amount:
          max

      })

      .select(
        'id,customer_id,upi_id,provider,enabled,min_amount,max_amount'
      )
      .maybeSingle();


  /* =================================
     DATABASE ERROR
  ================================= */

  if(error){

    console.error(
      'UPI Save Error:',
      error
    );


    if(
      String(
        error.message || ''
      )
      .toLowerCase()
      .includes('maximum 3')
    ){

      msg.textContent =
        'Maximum 3 UPI IDs allowed.';

    }
    else if(
      String(
        error.message || ''
      )
      .toLowerCase()
      .includes('duplicate')
    ){

      msg.textContent =
        'This UPI ID is already linked.';

    }
    else{

      msg.textContent =
        'Save Error: ' +
        (
          error.message ||
          'Unknown error'
        );

    }


    return;

  }


  /* =================================
     VERIFY
  ================================= */

  if(
    !data ||
    data.customer_id !== customerId ||
    data.upi_id !== upi
  ){

    msg.textContent =
      'UPI save could not be verified.';

    return;

  }


  /* =================================
     SUCCESS
  ================================= */

  msg.style.color =
    '#15803d';


  msg.textContent =
    'UPI added successfully.';


  setTimeout(
    async () => {

      modal.style.display =
        'none';


      document
        .getElementById('upiForm')
        .reset();


      document
        .getElementById('min')
        .value =
        50;


      document
        .getElementById('max')
        .value =
        1000000;


      await loadUPI();

    },

    500

  );

};


/* =====================================
   START PAGE
===================================== */

loadUPI();

</script>

</body>

                         </html>
