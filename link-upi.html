<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Sathi Pay - Link UPI</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#0f172a;
  padding-bottom:92px
}

.header{
  padding:22px 18px 12px;
  text-align:center;
  background:#f4f6fb
}

.header h1{
  margin:0;
  font-size:28px
}

.container{
  max-width:520px;
  margin:auto;
  padding:12px 16px 30px
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#1768f5,#315ee8);
  color:#fff;
  border-radius:22px;
  padding:22px 20px;
  margin-bottom:16px;
  box-shadow:0 10px 24px rgba(37,99,235,.22)
}

.card:after{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  right:-70px;
  top:-50px;
  background:rgba(255,255,255,.10)
}

.row{
  position:relative;
  z-index:1
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.upi-title{
  font-size:31px;
  font-weight:800
}

.status{
  padding:8px 15px;
  border-radius:20px;
  background:#16a34a;
  border:2px solid #fff;
  font-weight:700;
  cursor:pointer;
  user-select:none
}

.status.off{
  background:#ef4444
}

.upi{
  font-size:17px;
  margin-top:6px;
  word-break:break-all
}

.meta{
  margin-top:18px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.13);
  border-radius:15px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:14px;
  flex-wrap:wrap
}

.meta span{
  word-break:break-word
}

.empty{
  background:#fff;
  border-radius:18px;
  padding:24px;
  text-align:center;
  color:#64748b;
  margin-bottom:16px
}

.add{
  display:block;
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:#07101d;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer
}

.add:disabled{
  opacity:.5;
  cursor:not-allowed
}

.limit-note{
  text-align:center;
  font-size:13px;
  color:#64748b;
  margin:-7px 0 16px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:20;
  padding:18px;
  align-items:flex-end
}

.sheet{
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:22px;
  width:100%;
  max-width:520px;
  margin:auto
}

.sheet h2{
  margin:0 0 16px
}

.field{
  margin-bottom:13px
}

.field label{
  display:block;
  font-size:13px;
  color:#64748b;
  margin-bottom:6px
}

.field input,
.field select{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:12px;
  font-size:15px
}

.actions{
  display:flex;
  gap:10px
}

.actions button{
  flex:1;
  padding:14px;
  border:0;
  border-radius:12px;
  font-weight:700;
  cursor:pointer
}

.cancel{
  background:#e5e7eb
}

.save{
  background:#2563eb;
  color:#fff
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed
}

.msg{
  font-size:13px;
  margin-top:10px;
  min-height:18px;
  word-break:break-word
}

.pin-box{
  margin:2px 0 14px;
  padding:14px;
  border:1px solid #dbeafe;
  border-radius:14px;
  background:#f8fbff
}

.pin-title{
  font-size:14px;
  font-weight:800;
  color:#1e3a8a;
  margin-bottom:5px
}

.pin-note{
  font-size:12px;
  color:#64748b;
  margin-bottom:10px
}

.pin-inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.pin-inputs input{
  width:100%;
  padding:13px;
  border:1px solid #d7dce5;
  border-radius:12px;
  font-size:17px;
  letter-spacing:4px;
  text-align:center
}

.pin-forgot{
  display:block;
  margin-top:9px;
  color:#2563eb;
  font-size:13px;
  font-weight:700;
  text-align:right;
  text-decoration:none
}

@media(max-width:420px){
  .pin-inputs{grid-template-columns:1fr}
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:10
}

.bottom-nav a{
  text-decoration:none;
  color:#94a3b8;
  text-align:center;
  font-size:12px
}

.bottom-nav .plus{
  width:66px;
  height:66px;
  border-radius:50%;
  background:#1768f5;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  line-height:1;
  box-shadow:0 6px 18px rgba(37,99,235,.3);
  margin-top:-30px
}

.bottom-nav span{
  display:block;
  font-size:24px;
  margin-bottom:2px
}

</style>

</head>

<body>


<header class="header">

  <h1>Link UPI</h1>

</header>


<main class="container">

  <div id="upiList"></div>


  <div
    class="empty"
    id="emptyState"
    style="display:none"
  >

    No UPI linked yet.<br>

    Add your UPI ID below.

  </div>


  <div
    class="limit-note"
    id="limitNote"
  >
    You can add up to 3 UPI IDs.
  </div>


  <button
    class="add"
    id="addBtn"
    type="button"
  >

    Add UPI

  </button>

</main>


<div
  class="modal"
  id="modal"
>

  <div class="sheet">

    <h2>Add UPI</h2>


    <form id="upiForm">


      <div class="field">

        <label>Provider</label>

        <select
          id="provider"
          required
        >

          <option value="">
            Select Provider
          </option>

          <option>Paytm</option>

          <option>Navi</option>

          <option>PhonePe</option>

          <option>Google Pay</option>

          <option>MobiKwik</option>

          <option>Other</option>

        </select>

      </div>


      <div class="field">

        <label>UPI ID</label>

        <input
          id="upi"
          type="text"
          inputmode="email"
          autocomplete="off"
          placeholder="example@upi"
          maxlength="100"
          required
        >

      </div>


      <div class="field">

        <label>
          Payin Minimum (₹)
        </label>

        <input
          id="min"
          type="number"
          min="1"
          step="0.01"
          value="50"
          required
        >

      </div>


      <div class="field">

        <label>
          Payin Maximum (₹)
        </label>

        <input
          id="max"
          type="number"
          min="1"
          step="0.01"
          value="1000000"
          required
        >

      </div>


      <div
        class="pin-box"
        id="pinBox"
        style="display:none"
      >

        <div
          class="pin-title"
          id="pinTitle"
        >
          🔐 Set 6-Digit UPI PIN
        </div>

        <div
          class="pin-note"
          id="pinNote"
        >
          Create your 6-digit UPI PIN once. You will use the same PIN for future UPI additions.
        </div>

        <div class="pin-inputs">

          <input
            id="upiPin"
            type="password"
            inputmode="numeric"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            autocomplete="new-password"
            placeholder="6-digit PIN"
          >

          <input
            id="upiPinConfirm"
            type="password"
            inputmode="numeric"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            autocomplete="new-password"
            placeholder="Confirm PIN"
          >

        </div>

      </div>

      <a
        href="#"
        class="pin-forgot"
        id="forgotPinBtn"
      >
        Forgot PIN?
      </a>


      <div class="actions">

        <button
          class="cancel"
          type="button"
          id="cancelBtn"
        >

          Cancel

        </button>


        <button
          class="save"
          type="submit"
          id="saveBtn"
        >

          Save UPI

        </button>

      </div>


      <div
        class="msg"
        id="msg"
      ></div>


    </form>

  </div>

</div>


<nav class="bottom-nav">


  <a href="dashboard.html">

    <span>⌂</span>

    Home

  </a>


  <a href="deposit.html">

    <span>▣</span>

    Deposit

  </a>


  <a href="link-upi.html">

    <span class="plus">+</span>

  </a>


  <a href="referral.html">

    <span>♕</span>

    Team

  </a>


  <a href="wallet.html">

    <span>◉</span>

    Assets

  </a>


</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=8"></script>
<script src="customer-guard.js"></script>


<script>

/* =====================================
   SATHI PAY — MULTI UPI
   Maximum 3 UPI
   GLOBAL UPI UNIQUENESS
   Customer:
   ADD / ENABLE / DISABLE
   NO DELETE
===================================== */


/* =====================================
   ELEMENTS
===================================== */

const list =
  document.getElementById('upiList');

const empty =
  document.getElementById('emptyState');

const modal =
  document.getElementById('modal');

const msg =
  document.getElementById('msg');

const addBtn =
  document.getElementById('addBtn');

const limitNote =
  document.getElementById('limitNote');

const saveBtn =
  document.getElementById('saveBtn');

const pinBox =
  document.getElementById('pinBox');

const upiPin =
  document.getElementById('upiPin');

const upiPinConfirm =
  document.getElementById('upiPinConfirm');

const pinTitle =
  document.getElementById('pinTitle');

const pinNote =
  document.getElementById('pinNote');

const forgotPinBtn =
  document.getElementById('forgotPinBtn');

const providerField =
  document.getElementById('provider').closest('.field');

const upiField =
  document.getElementById('upi').closest('.field');

const minField =
  document.getElementById('min').closest('.field');

const maxField =
  document.getElementById('max').closest('.field');

const addUPIFields = [
  providerField,
  upiField,
  minField,
  maxField
];

function setAddUPIMode(){

  addUPIFields.forEach(field => {

    field.style.display =
      pinRequired ? 'none' : '';

    field.querySelectorAll(
      'input, select'
    ).forEach(input => {

      input.required =
        !pinRequired;

    });

  });

  pinBox.style.display =
    'block';

  forgotPinBtn.style.display =
    pinRequired ? 'none' : 'block';

  saveBtn.textContent =
    pinRequired ? 'Set PIN' : 'Save UPI';

  if(pinRequired){

    pinTitle.textContent =
      '🔐 Set 6-Digit UPI PIN';

    pinNote.textContent =
      'Create your 6-digit UPI PIN once. You will use the same PIN for future UPI additions.';

    upiPinConfirm.style.display =
      'block';

    upiPinConfirm.required =
      true;

    upiPin.placeholder =
      '6-digit PIN';

    upiPinConfirm.placeholder =
      'Confirm PIN';

  }
  else{

    pinTitle.textContent =
      '🔐 Enter 6-Digit UPI PIN';

    pinNote.textContent =
      'Enter the same 6-digit PIN you set earlier to save this UPI ID.';

    upiPinConfirm.value =
      '';

    upiPinConfirm.style.display =
      'none';

    upiPinConfirm.required =
      false;

    upiPin.placeholder =
      'Enter 6-digit PIN';

  }

}

let pinRequired = false;

let customerId = null;

let currentUPIs = [];


/* =====================================
   GET CUSTOMER ID
   USE SAVED SATHI PAY CUSTOMER ID
===================================== */

async function getCustomerId(){

  const id =
    localStorage.getItem(
      'sathiPayCustomerId'
    );


  if(
    !id ||
    id.trim() === ''
  ){

    window.location.href =
      'customer-login.html';

    return null;

  }


  customerId =
    id.trim();


  return customerId;

}


/* =====================================
   ESCAPE HTML
===================================== */

function esc(v){

  return String(
    v ?? ''
  ).replace(
    /[&<>"']/g,

    c => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#39;'

    }[c])

  );

}


/* =====================================
   FORMAT MONEY
===================================== */

function money(v){

  const n =
    Number(v);


  if(
    !Number.isFinite(n)
  ){

    return '0.00';

  }


  return n.toFixed(2);

}


/* =====================================
   MIGRATE OLD SINGLE UPI
===================================== */

async function migrateOldUPI(id){

  try{

    const {
      data: existing,
      error: existingError
    } =
      await supabaseClient

        .from('customer_upis')

        .select('id,upi_id')

        .eq(
          'customer_id',
          id
        );


    if(existingError){

      console.error(
        'New UPI table check error:',
        existingError
      );

      return;

    }


    if(
      existing &&
      existing.length > 0
    ){

      return;

    }


    const {
      data: oldData,
      error: oldError
    } =
      await supabaseClient

        .from('customers')

        .select(
          'id,upi_id,upi_provider,upi_enabled,upi_min_amount,upi_max_amount'
        )

        .eq(
          'id',
          id
        )

        .maybeSingle();


    if(oldError){

      console.error(
        'Old UPI read error:',
        oldError
      );

      return;

    }


    if(
      !oldData ||
      !oldData.upi_id
    ){

      return;

    }


    const {
      error: insertError
    } =
      await supabaseClient

        .from('customer_upis')

        .insert({

          customer_id:
            id,

          upi_id:
            String(
              oldData.upi_id
            )
            .trim()
            .toLowerCase(),

          provider:
            oldData.upi_provider ||
            'Other',

          enabled:
            oldData.upi_enabled !== false,

          min_amount:
            Number(
              oldData.upi_min_amount ||
              50
            ),

          max_amount:
            Number(
              oldData.upi_max_amount ||
              1000000
            )

        });


    if(insertError){

      console.warn(
        'Old UPI migration:',
        insertError
      );

      return;

    }


    console.log(
      'Old UPI migrated successfully.'
    );

  }
  catch(error){

    console.error(
      'UPI migration error:',
      error
    );

  }

}


/* =====================================
   LOAD ALL UPIs
===================================== */

async function loadUPI(){

  const id =
    await getCustomerId();


  if(!id){

    return;

  }


  await migrateOldUPI(id);


  const {
    data,
    error
  } =
    await supabaseClient

      .from('customer_upis')

      .select(
        'id,customer_id,upi_id,provider,enabled,min_amount,max_amount,created_at,updated_at'
      )

      .eq(
        'customer_id',
        id
      )

      .order(
        'created_at',
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      'UPI Load Error:',
      error
    );


    list.innerHTML =
      '<div class="empty">Load Error: ' +
      esc(
        error.message ||
        'Unknown error'
      ) +
      '</div>';


    empty.style.display =
      'none';

    return;

  }


  currentUPIs =
    Array.isArray(data)
      ? data
      : [];


  renderUPIs();

}


/* =====================================
   RENDER UPI CARDS
===================================== */

function renderUPIs(){

  list.innerHTML =
    '';


  if(
    currentUPIs.length === 0
  ){

    empty.style.display =
      'block';

  }
  else{

    empty.style.display =
      'none';

  }


  const visibleUPIs =
    currentUPIs.slice(
      0,
      3
    );


  visibleUPIs.forEach(
    (item,index) => {

      const enabled =
        item.enabled !== false;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      card.innerHTML = `

        <div class="row">

          <div class="top">

            <div class="upi-title">

              UPI ${index + 1}

            </div>


            <div
              class="status ${
                enabled ? '' : 'off'
              }"
              data-id="${esc(item.id)}"
              role="button"
              tabindex="0"
              title="Tap to ${
                enabled
                  ? 'disable'
                  : 'enable'
              }"
            >

              ${
                enabled
                  ? 'Enabled'
                  : 'Disabled'
              }

            </div>

          </div>


          <div class="upi">

            ${esc(item.upi_id)}

          </div>


          <div class="meta">

            <span>

              Payin:

              ₹${money(item.min_amount)}

              ~

              ₹${money(item.max_amount)}

            </span>


            <span>

              ${esc(
                item.provider ||
                'Other'
              )}

            </span>

          </div>

        </div>

      `;


      list.appendChild(
        card
      );


      const status =
        card.querySelector(
          '.status'
        );


      status.addEventListener(
        'click',
        () => {

          toggleUPI(
            item.id,
            enabled
          );

        }
      );


      status.addEventListener(
        'keydown',
        event => {

          if(
            event.key === 'Enter' ||
            event.key === ' '
          ){

            event.preventDefault();

            toggleUPI(
              item.id,
              enabled
            );

          }

        }
      );

    }
  );


  updateAddButton();

}


/* =====================================
   ADD BUTTON / 3 UPI LIMIT
===================================== */

function updateAddButton(){

  const count =
    currentUPIs.length;


  if(
    count >= 3
  ){

    addBtn.disabled =
      true;

    addBtn.textContent =
      'Maximum 3 UPI Added';

    limitNote.textContent =
      'Maximum 3 UPI IDs allowed.';

  }
  else{

    addBtn.disabled =
      false;

    addBtn.textContent =
      'Add UPI';

    limitNote.textContent =
      `${count}/3 UPI IDs added.`;

  }

}


/* =====================================
   ENABLE / DISABLE UPI
===================================== */

async function toggleUPI(
  upiRowId,
  currentEnabled
){

  if(!upiRowId){

    return;

  }


  const nextEnabled =
    !currentEnabled;


  const status =
    document.querySelector(
      `.status[data-id="${CSS.escape(upiRowId)}"]`
    );


  if(status){

    status.style.pointerEvents =
      'none';

    status.textContent =
      'Saving...';

  }


  const {
    error
  } =
    await supabaseClient

      .from('customer_upis')

      .update({

        enabled:
          nextEnabled,

        updated_at:
          new Date().toISOString()

      })

      .eq(
        'id',
        upiRowId
      )

      .eq(
        'customer_id',
        customerId
      );


  if(error){

    console.error(
      'UPI Status Error:',
      error
    );


    alert(
      'Unable to change UPI status: ' +
      (
        error.message ||
        'Unknown error'
      )
    );


    if(status){

      status.style.pointerEvents =
        '';

    }


    return;

  }


  await loadUPI();

}


/* =====================================
   UPI PIN STATE
===================================== */

async function loadPinState(){

  const {
    data,
    error
  } =
    await supabaseClient
      .rpc('get_customer_upi_pin_state', {
        p_customer_id: customerId
      });

  if(error){

    console.error(
      'UPI PIN state error:',
      error
    );

    /*
     * If PIN-state lookup fails, never assume a PIN
     * already exists. First-time users must still see
     * the PIN setup screen.
     */
    pinRequired = true;
    setAddUPIMode();
    return;

  }

  pinRequired =
    data !== true;

  setAddUPIMode();

}
/* =====================================
   PIN INPUT — DIGITS ONLY
===================================== */

[upiPin, upiPinConfirm].forEach(
  input => {

    input.addEventListener(
      'input',
      () => {

        input.value =
          input.value
            .replace(/\D/g, '')
            .slice(0, 6);

      }
    );

  }
);


/* =====================================
   FORGOT PIN — EMAIL VERIFICATION
===================================== */

forgotPinBtn.addEventListener(
  'click',
  async event => {

    event.preventDefault();

    const {
      data: authData,
      error: authError
    } =
      await supabaseClient.auth.getUser();

    if(
      authError ||
      !authData ||
      !authData.user ||
      !authData.user.email
    ){

      msg.style.color = '#dc2626';
      msg.textContent =
        'Please login again to reset your UPI PIN.';

      return;

    }

    const email =
      String(authData.user.email)
        .trim()
        .toLowerCase();

    const redirectTo =
      window.location.origin +
      window.location.pathname
        .replace(
          'link-upi.html',
          'reset-upi-pin.html'
        );

    forgotPinBtn.style.pointerEvents = 'none';
    forgotPinBtn.textContent = 'Sending verification...';

    msg.style.color = '#2563eb';
    msg.textContent =
      'Sending verification link to your registered email...';

    const {
      error
    } =
      await supabaseClient.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: false,
          emailRedirectTo: redirectTo
        }
      });

    if(error){

      console.error(
        'UPI PIN verification email error:',
        error
      );

      msg.style.color = '#dc2626';
      msg.textContent =
        'Unable to send verification email: ' +
        (error.message || 'Unknown error');

      forgotPinBtn.style.pointerEvents = '';
      forgotPinBtn.textContent = 'Forgot PIN?';
      return;

    }

    msg.style.color = '#15803d';
    msg.textContent =
      '✅ Verification link sent. Check your registered email.';

    forgotPinBtn.style.pointerEvents = '';
    forgotPinBtn.textContent = 'Forgot PIN?';

  }
);


/* =====================================
   OPEN ADD MODAL
===================================== */

addBtn.onclick = async () => {

  if(
    currentUPIs.length >= 3
  ){

    return;

  }


  msg.textContent =
    '';

  msg.style.color =
    '#dc2626';


  document
    .getElementById('upiForm')
    .reset();


  document
    .getElementById('min')
    .value =
    50;


  document
    .getElementById('max')
    .value =
    1000000;


  saveBtn.disabled =
    false;


  saveBtn.textContent =
    'Save UPI';

  pinRequired = false;

  pinBox.style.display = 'none';

  await loadPinState();

  upiPin.value = '';
  upiPinConfirm.value = '';

  modal.style.display =
    'flex';

};


/* =====================================
   CANCEL
===================================== */

document.getElementById(
  'cancelBtn'
).onclick = () => {

  modal.style.display =
    'none';

};


/* =====================================
   CLOSE MODAL ON BACKGROUND
===================================== */

modal.addEventListener(
  'click',
  event => {

    if(
      event.target === modal
    ){

      modal.style.display =
        'none';

    }

  }
);


/* =====================================
   SAVE NEW UPI
===================================== */

document.getElementById(
  'upiForm'
).onsubmit = async e => {

  e.preventDefault();


  msg.style.color =
    '#dc2626';

  msg.textContent =
    '';


  if(
    currentUPIs.length >= 3
  ){

    msg.textContent =
      'Maximum 3 UPI IDs allowed.';

    return;

  }


  /* =================================
     FIRST-TIME PIN SETUP
  ================================= */

  if(pinRequired){

    const newPin =
      upiPin.value.trim();

    const confirmPin =
      upiPinConfirm.value.trim();

    if(!/^\d{6}$/.test(newPin)){

      msg.textContent =
        'UPI PIN must be exactly 6 digits.';

      upiPin.focus();
      return;

    }

    if(newPin !== confirmPin){

      msg.textContent =
        'UPI PINs do not match.';

      upiPinConfirm.focus();
      return;

    }

    saveBtn.disabled = true;
    saveBtn.textContent =
      'Setting PIN...';

    const {
      data: pinSaved,
      error: pinError
    } =
      await supabaseClient.rpc(
        'create_customer_upi_pin',
        {
          p_customer_id: customerId,
          p_pin: newPin
        }
      );

    if(
      pinError ||
      pinSaved !== true
    ){

      console.error(
        'UPI PIN Save Error:',
        pinError
      );

      saveBtn.disabled = false;
      saveBtn.textContent =
        'Set PIN';

      msg.textContent =
        'Unable to set UPI PIN. Please try again.';

      return;

    }

    pinRequired = false;

    upiPin.value = '';
    upiPinConfirm.value = '';

    setAddUPIMode();

    saveBtn.disabled = false;

    msg.style.color =
      '#15803d';

    msg.textContent =
      '✅ UPI PIN set successfully. Now add your UPI ID.';

    return;

  }


  const upi =
    document
      .getElementById('upi')
      .value
      .trim()
      .toLowerCase();


  const provider =
    document
      .getElementById('provider')
      .value;


  const min =
    Number(
      document
        .getElementById('min')
        .value
    );


  const max =
    Number(
      document
        .getElementById('max')
        .value
    );


  /* =================================
     VALIDATION
  ================================= */

  if(
    !/^[^\s@]+@[^\s@]+$/.test(upi)
  ){

    msg.textContent =
      'Enter a valid UPI ID.';

    return;

  }


  if(!provider){

    msg.textContent =
      'Select a provider.';

    return;

  }


  if(
    !Number.isFinite(min) ||
    !Number.isFinite(max) ||
    min <= 0 ||
    max < min
  ){

    msg.textContent =
      'Check the payin range.';

    return;

  }


  /* =================================
     UPI PIN VALIDATION
  ================================= */

  const newPin =
    upiPin.value.trim();

  if(!/^\d{6}$/.test(newPin)){

    msg.textContent =
      'UPI PIN must be exactly 6 digits.';

    upiPin.focus();
    return;

  }

  const {
    data: pinVerified,
    error: pinVerifyError
  } =
    await supabaseClient.rpc(
      'verify_customer_upi_pin',
      {
        p_customer_id: customerId,
        p_pin: newPin
      }
    );

  if(
    pinVerifyError ||
    pinVerified !== true
  ){

    console.error(
      'UPI PIN Verify Error:',
      pinVerifyError
    );

    msg.textContent =
      'Incorrect UPI PIN. Please enter the same PIN you set earlier.';

    upiPin.focus();
    return;

  }


  /* =================================
     GET SAVED CUSTOMER ID
  ================================= */

  customerId =
    await getCustomerId();


  if(!customerId){

    return;

  }


  /* =================================
     FINAL COUNT CHECK
  ================================= */

  const {
    data: latestUPIs,
    error: countError
  } =
    await supabaseClient

      .from('customer_upis')

      .select(
        'id'
      )

      .eq(
        'customer_id',
        customerId
      );


  if(countError){

    msg.textContent =
      'Unable to verify UPI limit: ' +
      (
        countError.message ||
        'Unknown error'
      );

    return;

  }


  if(
    latestUPIs &&
    latestUPIs.length >= 3
  ){

    msg.textContent =
      'Maximum 3 UPI IDs allowed.';

    await loadUPI();

    return;

  }


  /* =================================
     CHECK SAME CUSTOMER DUPLICATE
  ================================= */

  const {
    data: ownUPIs,
    error: ownDuplicateError
  } =
    await supabaseClient

      .from('customer_upis')

      .select(
        'id,upi_id'
      )

      .eq(
        'customer_id',
        customerId
      );


  if(ownDuplicateError){

    msg.textContent =
      'Unable to check existing UPI IDs.';

    return;

  }


  const ownDuplicate =
    (ownUPIs || []).some(
      row =>
        String(
          row.upi_id ||
          ''
        )
        .trim()
        .toLowerCase() === upi
    );


  if(ownDuplicate){

    msg.textContent =
      'This UPI ID is already linked to your account.';

    return;

  }


  /* =================================
     SAVE BUTTON LOCK
  ================================= */

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    'Checking...';


  /* =================================
     INSERT

     GLOBAL DUPLICATE IS ENFORCED
     BY SUPABASE DATABASE TRIGGER
  ================================= */

  const {
    data,
    error
  } =
    await supabaseClient

      .from('customer_upis')

      .insert({

        customer_id:
          customerId,

        upi_id:
          upi,

        provider:
          provider,

        enabled:
          true,

        min_amount:
          min,

        max_amount:
          max

      })

      .select(
        'id,customer_id,upi_id,provider,enabled,min_amount,max_amount'
      )
      .maybeSingle();


  /* =================================
     DATABASE ERROR
  ================================= */

  if(error){

    console.error(
      'UPI Save Error:',
      error
    );


    saveBtn.disabled =
      false;

    saveBtn.textContent =
      'Save UPI';


    const errorText =
      (
        String(
          error.message ||
          ''
        ) +
        ' ' +
        String(
          error.details ||
          ''
        ) +
        ' ' +
        String(
          error.hint ||
          ''
        )
      )
      .toLowerCase();


    /* GLOBAL DUPLICATE */

    if(
      errorText.includes(
        'upi_already_linked'
      ) ||
      errorText.includes(
        'upi already linked'
      )
    ){

      msg.textContent =
        'This UPI ID is already linked to another account.';

      return;

    }


    /* MAXIMUM 3 */

    if(
      errorText.includes(
        'maximum 3'
      )
    ){

      msg.textContent =
        'Maximum 3 UPI IDs allowed.';

      await loadUPI();

      return;

    }


    msg.textContent =
      'Save Error: ' +
      (
        error.message ||
        'Unknown error'
      );

    return;

  }


  /* =================================
     VERIFY
  ================================= */

  if(
    !data ||
    data.customer_id !== customerId ||
    String(
      data.upi_id ||
      ''
    )
    .trim()
    .toLowerCase() !== upi
  ){

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      'Save UPI';


    msg.textContent =
      'UPI save could not be verified.';

    return;

  }


  /* =================================
     SUCCESS
  ================================= */

  msg.style.color =
    '#15803d';


  msg.textContent =
    'UPI added successfully.';


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    'Saved';


  setTimeout(
    async () => {

      modal.style.display =
        'none';


      document
        .getElementById('upiForm')
        .reset();


      document
        .getElementById('min')
        .value =
        50;


      document
        .getElementById('max')
        .value =
        1000000;

      upiPin.value = '';
      upiPinConfirm.value = '';

      await loadPinState();


      saveBtn.disabled =
        false;


      saveBtn.textContent =
        'Save UPI';


      await loadUPI();

    },

    500

  );

};


/* =====================================
   START PAGE
===================================== */

loadUPI();

</script>
