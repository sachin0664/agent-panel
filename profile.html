<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - My Profile</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #202938;
        }


        .header {
            background: #202938;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .header h2 {
            margin: 0;
            font-size: 22px;
        }


        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }


        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }


        .card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }


        .profile-icon {
            width: 80px;
            height: 80px;
            background: #202938;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 15px;
        }


        .profile-title {
            text-align: center;
            margin-bottom: 25px;
        }


        .profile-title h2 {
            margin: 5px 0;
        }


        .profile-title p {
            color: #777;
            margin: 0;
        }


        .info {
            border-bottom: 1px solid #eee;
            padding: 14px 0;
        }


        .info:last-child {
            border-bottom: none;
        }


        .label {
            color: #777;
            font-size: 14px;
            margin-bottom: 5px;
        }


        .value {
            font-weight: bold;
            font-size: 16px;
        }


        .uid-value {
            color: #2563eb;
            font-size: 18px;
            letter-spacing: 1px;
        }


        .back-btn {
            display: block;
            text-align: center;
            background: #202938;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 9px;
            font-weight: bold;
            margin-top: 20px;
        }

    </style>

</head>


<body>


    <div class="header">

        <h2>
            Sathi Pay - Profile
        </h2>

        <a href="deshboard.html">
            Dashboard
        </a>

    </div>


    <div class="container">


        <div class="card">


            <div class="profile-icon">
                👤
            </div>


            <div class="profile-title">

                <h2>
                    My Profile
                </h2>

                <p>
                    Sathi Pay Agent Account
                </p>

            </div>


            <!-- UID -->

            <div class="info">

                <div class="label">
                    UID
                </div>

                <div
                    class="value uid-value"
                    id="profileUID"
                >
                    Loading...
                </div>

            </div>


            <!-- NAME -->

            <div class="info">

                <div class="label">
                    Name
                </div>

                <div
                    class="value"
                    id="profileName"
                >
                    Agent
                </div>

            </div>


            <!-- MOBILE -->

            <div class="info">

                <div class="label">
                    Mobile Number
                </div>

                <div
                    class="value"
                    id="profileMobile"
                >
                    Not available
                </div>

            </div>


            <!-- STATUS -->

            <div class="info">

                <div class="label">
                    Account Status
                </div>

                <div class="value">
                    Active
                </div>

            </div>


            <!-- ACCOUNT TYPE -->

            <div class="info">

                <div class="label">
                    Account Type
                </div>

                <div class="value">
                    Agent
                </div>

            </div>


            <a
                class="back-btn"
                href="deshboard.html"
            >
                ← Back to Dashboard
            </a>


        </div>

    </div>


    <script>


        const name =
            localStorage.getItem(
                "agentName"
            );


        const mobile =
            localStorage.getItem(
                "agentMobile"
            );


        const uid =
            localStorage.getItem(
                "sathi_uid"
            );


        if (name) {

            document
                .getElementById("profileName")
                .innerText = name;

        }


        if (mobile) {

            document
                .getElementById("profileMobile")
                .innerText = mobile;

        }


        if (uid) {

            document
                .getElementById("profileUID")
                .innerText = uid;

        } else {

            document
                .getElementById("profileUID")
                .innerText =
                "UID not available";

        }

    </script>


</body>

                    </html>
