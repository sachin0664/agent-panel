<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - My Profile</title>
<script src="customer-guard.js"></script>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #202938;
        }

        .header {
            background: #202938;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-icon {
            width: 80px;
            height: 80px;
            background: #202938;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 15px;
        }

        .profile-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-title h2 {
            margin: 5px 0;
        }

        .profile-title p {
            color: #777;
            margin: 0;
        }

        .info {
            border-bottom: 1px solid #eee;
            padding: 14px 0;
        }

        .info:last-child {
            border-bottom: none;
        }

        .label {
            color: #777;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .value {
            font-weight: bold;
            font-size: 16px;
            word-break: break-all;
        }

        .uid {
            color: #1565c0;
            font-size: 18px;
        }

        .status {
            color: green;
        }

        .error {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .back-btn {
            display: block;
            text-align: center;
            background: #202938;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 9px;
            font-weight: bold;
            margin-top: 20px;
        }

    </style>

</head>


<body>


<header class="header">

    <h2>Sathi Pay - Profile</h2>

    <a href="deshboard.html">
        Dashboard
    </a>

</header>



<main class="container">


    <div class="card">


        <div class="profile-icon">
            👤
        </div>



        <div class="profile-title">

            <h2>My Profile</h2>

            <p>Sathi Pay Customer Account</p>

        </div>



        <!-- UID -->

        <div class="info">

            <div class="label">
                UID Number
            </div>

            <div
                class="value uid"
                id="profileUID"
            >
                Loading...
            </div>

        </div>



        <!-- NAME -->

        <div class="info">

            <div class="label">
                Name
            </div>

            <div
                class="value"
                id="profileName"
            >
                Loading...
            </div>

        </div>



        <!-- MOBILE -->

        <div class="info">

            <div class="label">
                Mobile Number
            </div>

            <div
                class="value"
                id="profileMobile"
            >
                Loading...
            </div>

        </div>



        <!-- EMAIL -->

        <div class="info">

            <div class="label">
                Email Address
            </div>

            <div
                class="value"
                id="profileEmail"
            >
                Loading...
            </div>

        </div>



        <!-- STATUS -->

        <div class="info">

            <div class="label">
                Account Status
            </div>

            <div
                class="value status"
                id="profileStatus"
            >
                Loading...
            </div>

        </div>



        <!-- ACCOUNT TYPE -->

        <div class="info">

            <div class="label">
                Account Type
            </div>

            <div class="value">
                Customer
            </div>

        </div>



        <!-- UPI -->

        <div class="info">

            <div class="label">
                UPI ID
            </div>

            <div
                class="value"
                id="profileUPI"
            >
                Loading...
            </div>

        </div>



        <a
            class="back-btn"
            href="deshboard.html"
        >
            ← Back to Dashboard
        </a>


        <div
            id="profileError"
            class="error"
        ></div>


    </div>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=6"></script>



<script>


async function loadCustomerProfile() {

    const errorBox =
        document.getElementById("profileError");


    try {


        /* ================================
           GET CURRENT LOGGED-IN USER
        ================================= */

        const {
            data: authData,
            error: authError
        } =
            await supabaseClient.auth.getUser();


        if (authError) {

            console.error(
                "Auth Error:",
                authError
            );

            errorBox.innerText =
                "Please login again.";

            return;

        }


        const user =
            authData?.user;


        if (!user || !user.id) {

            errorBox.innerText =
                "Customer login session not found.";

            setTimeout(function() {

                window.location.href =
                    "customer-login.html";

            }, 1000);

            return;

        }



        /* ================================
           LOAD CURRENT CUSTOMER
        ================================= */

        const {
            data: customer,
            error: customerError
        } =
            await supabaseClient

                .from("customers")

                .select(`
                    id,
                    uid,
                    name,
                    mobile,
                    invitation_code,
                    wallet_balance,
                    bonus_balance,
                    deposit_balance,
                    commission_balance,
                    referral_balance,
                    withdrawal_balance,
                    sell_on,
                    upi_id,
                    qr_code_url,
                    status
                `)

                .eq(
                    "id",
                    user.id
                )

                .maybeSingle();



        if (customerError) {

            console.error(
                "Customer Profile Error:",
                customerError
            );

            errorBox.innerText =
                "Unable to load customer profile.";

            return;

        }



        if (!customer) {

            errorBox.innerText =
                "Customer profile not found.";

            return;

        }



        /* ================================
           DISPLAY CURRENT CUSTOMER DATA
        ================================= */

        document.getElementById(
            "profileUID"
        ).innerText =
            customer.uid || "Not available";


        document.getElementById(
            "profileName"
        ).innerText =
            customer.name || "Not available";


        document.getElementById(
            "profileMobile"
        ).innerText =
            customer.mobile || "Not available";


        document.getElementById(
            "profileEmail"
        ).innerText =
            user.email || "Not available";


        document.getElementById(
            "profileStatus"
        ).innerText =
            customer.status || "Active";


        document.getElementById(
            "profileUPI"
        ).innerText =
            customer.upi_id || "Not added";


        /* ================================
           UPDATE CUSTOMER LOCAL STORAGE
        ================================= */

        localStorage.setItem(
            "sathiPayCustomerId",
            customer.id
        );


        localStorage.setItem(
            "sathiPayUID",
            customer.uid || ""
        );


        localStorage.setItem(
            "sathiPayCustomerName",
            customer.name || ""
        );


        localStorage.setItem(
            "sathiPayCustomerMobile",
            customer.mobile || ""
        );


        localStorage.setItem(
            "sathiPayInvitationCode",
            customer.invitation_code || ""
        );


    }

    catch (error) {

        console.error(
            "Profile Exception:",
            error
        );

        errorBox.innerText =
            "Something went wrong while loading profile.";

    }

}



/* LOAD PROFILE */

loadCustomerProfile();


</script>


</body>

</html>
