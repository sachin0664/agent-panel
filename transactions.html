<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sathi Pay - Transactions</title>

<script src="customer-guard.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #172033;
}

.header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(37,99,235,.18);
}

.header h1 {
    margin: 0;
    font-size: 21px;
}

.header a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 18px 14px 35px;
}

.page-title {
    margin-bottom: 15px;
}

.page-title h2 {
    margin: 0 0 5px;
    font-size: 23px;
}

.page-title p {
    margin: 0;
    color: #64748b;
    font-size: 14px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.summary-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 7px 20px rgba(30,64,175,.08);
}

.summary-label {
    color: #64748b;
    font-size: 12px;
    margin-bottom: 7px;
}

.summary-value {
    font-size: 21px;
    font-weight: bold;
}

.blue {
    color: #2563eb;
}

.green {
    color: #15803d;
}

.orange {
    color: #b45309;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 7px 22px rgba(30,64,175,.08);
    overflow: hidden;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #f1f5ff;
    color: #334155;
    font-size: 13px;
    text-align: left;
    padding: 13px 10px;
}

td {
    border-bottom: 1px solid #edf0f5;
    padding: 14px 10px;
    font-size: 13px;
    vertical-align: middle;
}

tr:last-child td {
    border-bottom: none;
}

.amount {
    font-weight: bold;
    color: #172033;
}

.commission {
    color: #15803d;
    font-weight: bold;
}

.utr {
    color: #475569;
    font-family: monospace;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    text-transform: capitalize;
}

.status-approved {
    background: #dcfce7;
    color: #15803d;
}

.status-pending {
    background: #fef3c7;
    color: #b45309;
}

.status-rejected {
    background: #fee2e2;
    color: #dc2626;
}

.status-default {
    background: #e2e8f0;
    color: #475569;
}

.empty {
    text-align: center;
    padding: 35px 15px;
    color: #64748b;
}

.message {
    text-align: center;
    margin-top: 14px;
    color: #64748b;
    font-size: 13px;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
}

.action-btn {
    text-decoration: none;
    text-align: center;
    padding: 13px 10px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 13px;
}

.deposit-btn {
    background: #dbeafe;
    color: #1d4ed8;
}

.wallet-btn {
    background: #dcfce7;
    color: #15803d;
}

.dashboard-btn {
    background: #ede9fe;
    color: #6d28d9;
}

@media (max-width: 650px) {

    .header {
        padding: 16px;
    }

    .header h1 {
        font-size: 18px;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px 10px 30px;
    }

    .card {
        padding: 10px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>Sathi Pay</h1>

    <a href="deshboard.html">
        Dashboard
    </a>

</header>


<main class="container">


<div class="page-title">

    <h2>
        Transaction History
    </h2>

    <p>
        Your deposit transactions and commission details
    </p>

</div>


<div class="summary">


    <div class="summary-card">

        <div class="summary-label">
            Total Deposits
        </div>

        <div
            class="summary-value blue"
            id="totalDeposits"
        >
            ₹0.00
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Approved Deposits
        </div>

        <div
            class="summary-value green"
            id="approvedDeposits"
        >
            ₹0.00
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Total Commission
        </div>

        <div
            class="summary-value orange"
            id="totalCommission"
        >
            ₹0.00
        </div>

    </div>

</div>


<div class="card">

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Date
                    </th>

                    <th>
                        UTR
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Commission
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>


            <tbody id="transactionTable">

                <tr>

                    <td colspan="5" class="empty">
                        Loading transactions...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<div
    id="transactionMessage"
    class="message"
></div>


<div class="actions">

    <a
        class="action-btn deposit-btn"
        href="deposit.html"
    >
        💳 New Deposit
    </a>

    <a
        class="action-btn wallet-btn"
        href="wallet.html"
    >
        💰 Wallet
    </a>

    <a
        class="action-btn dashboard-btn"
        href="deshboard.html"
    >
        🏠 Dashboard
    </a>

</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=6"></script>


<script>

async function loadTransactions() {

    const table =
        document.getElementById(
            "transactionTable"
        );

    const message =
        document.getElementById(
            "transactionMessage"
        );


    const customerId =
        localStorage.getItem(
            "sathiPayCustomerId"
        );


    if (!customerId) {

        window.location.href =
            "customer-login.html";

        return;

    }


    table.innerHTML = `
        <tr>
            <td colspan="5" class="empty">
                Loading transactions...
            </td>
        </tr>
    `;


    try {


        const {
            data: deposits,
            error
        } = await supabaseClient

            .from("customer_deposits")

            .select(`
                id,
                amount,
                status,
                utr,
                commission,
                created_at
            `)

            .eq(
                "customer_id",
                customerId
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Transaction Error:",
                error
            );

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Unable to load transactions.
                    </td>
                </tr>
            `;

            message.innerText =
                error.message;

            return;

        }


        const records =
            deposits || [];


        let totalDeposits = 0;
        let approvedDeposits = 0;
        let totalCommission = 0;


        records.forEach(
            function (deposit) {

                const amount =
                    Number(
                        deposit.amount
                    ) || 0;

                const commission =
                    Number(
                        deposit.commission
                    ) || 0;


                totalDeposits += amount;

                totalCommission +=
                    commission;


                if (
                    String(
                        deposit.status || ""
                    ).toLowerCase() ===
                    "approved"
                ) {

                    approvedDeposits +=
                        amount;

                }

            }
        );


        document.getElementById(
            "totalDeposits"
        ).innerText =
            "₹" +
            totalDeposits.toFixed(2);


        document.getElementById(
            "approvedDeposits"
        ).innerText =
            "₹" +
            approvedDeposits.toFixed(2);


        document.getElementById(
            "totalCommission"
        ).innerText =
            "₹" +
            totalCommission.toFixed(2);


        if (records.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        No deposit transactions found.
                    </td>
                </tr>
            `;

            message.innerText =
                "No transactions available.";

            return;

        }


        table.innerHTML = "";


        records.forEach(
            function (deposit) {

                const amount =
                    Number(
                        deposit.amount
                    ) || 0;


                const commission =
                    Number(
                        deposit.commission
                    ) || 0;


                const date =
                    deposit.created_at
                        ? new Date(
                            deposit.created_at
                        ).toLocaleString(
                            "en-IN"
                        )
                        : "N/A";


                const status =
                    String(
                        deposit.status ||
                        "pending"
                    ).toLowerCase();


                let statusClass =
                    "status-default";


                if (
                    status === "approved"
                ) {

                    statusClass =
                        "status-approved";

                }
                else if (
                    status === "pending"
                ) {

                    statusClass =
                        "status-pending";

                }
                else if (
                    status === "rejected"
                ) {

                    statusClass =
                        "status-rejected";

                }


                table.innerHTML += `

                    <tr>

                        <td>
                            ${date}
                        </td>

                        <td class="utr">
                            ${deposit.utr || "N/A"}
                        </td>

                        <td class="amount">
                            ₹${amount.toFixed(2)}
                        </td>

                        <td class="commission">
                            ₹${commission.toFixed(2)}
                        </td>

                        <td>
                            <span
                                class="status ${statusClass}"
                            >
                                ${status}
                            </span>
                        </td>

                    </tr>

                `;

            }
        );


        message.innerText =
            records.length +
            " transaction(s) loaded.";


    }

    catch (error) {

        console.error(
            "Transaction Exception:",
            error
        );

        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Something went wrong.
                </td>
            </tr>
        `;

        message.innerText =
            "Unable to load transaction history.";

    }

}


loadTransactions();

</script>


</body>

</html>
