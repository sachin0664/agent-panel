<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sathi Pay - Transaction History</title>

<script src="customer-guard.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 5%,rgba(8,127,245,.08),transparent 25%),
        radial-gradient(circle at 90% 20%,rgba(10,203,157,.08),transparent 25%),
        #f3f8ff;
    color:#173d76;
}

.header{
    background:linear-gradient(135deg,#173ed1,#087ff5,#0acb9d);
    color:white;
    padding:15px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 18px rgba(20,70,150,.16);
}

.header h1{
    margin:0;
    font-size:20px;
    font-weight:900;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:12px;
    font-weight:900;
    background:rgba(255,255,255,.16);
    padding:9px 13px;
    border-radius:12px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:18px 13px 35px;
}

.page-title{
    margin-bottom:14px;
}

.page-title h2{
    margin:0 0 5px;
    font-size:23px;
    color:#123e7a;
}

.page-title p{
    margin:0;
    color:#718199;
    font-size:12px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
    margin-bottom:15px;
}

.summary-card{
    background:white;
    border:1px solid #e6edf6;
    border-radius:16px;
    padding:13px;
    box-shadow:0 6px 18px rgba(20,60,100,.06);
    min-width:0;
}

.summary-label{
    color:#74839a;
    font-size:10px;
    font-weight:800;
    line-height:1.3;
}

.summary-value{
    margin-top:6px;
    font-size:18px;
    font-weight:900;
    word-break:break-word;
}

.blue{color:#2563eb;}
.green{color:#08a96d;}
.orange{color:#d97706;}
.purple{color:#7c3aed;}
.red{color:#dc3545;}

.card{
    background:white;
    border:1px solid #e6edf6;
    border-radius:19px;
    padding:10px;
    box-shadow:0 7px 22px rgba(20,60,100,.07);
    overflow:hidden;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:720px;
}

th{
    background:#f1f6ff;
    color:#334f73;
    font-size:11px;
    text-align:left;
    padding:12px 9px;
}

td{
    border-bottom:1px solid #edf2f7;
    padding:12px 9px;
    font-size:11px;
    vertical-align:middle;
}

tr:last-child td{
    border-bottom:none;
}

.type{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:900;
    color:#173d76;
}

.type-icon{
    width:34px;
    height:34px;
    border-radius:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
    background:linear-gradient(135deg,#eef6ff,#f4efff);
    box-shadow:0 4px 12px rgba(20,60,100,.08);
}

.type-name{
    line-height:1.2;
}

.details{
    color:#75849a;
    margin-top:3px;
    font-size:9px;
    max-width:250px;
    word-break:break-word;
}

.amount{
    font-weight:900;
    white-space:nowrap;
}

.credit{
    color:#08a96d;
}

.debit{
    color:#dc3545;
}

.info{
    color:#d97706;
}

.status{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
    text-transform:capitalize;
}

.status-approved,
.status-success{
    background:#e8fff4;
    color:#08a56c;
}

.status-pending{
    background:#fff7df;
    color:#b45309;
}

.status-rejected,
.status-failed{
    background:#fff0f2;
    color:#dc3545;
}

.status-default{
    background:#edf2f7;
    color:#607086;
}

.date{
    white-space:nowrap;
    color:#65758c;
    font-size:10px;
    line-height:1.35;
}

.date-day{
    font-weight:900;
    color:#334f73;
}

.date-time{
    margin-top:2px;
    color:#9aa7b8;
    font-size:9px;
}

.empty{
    text-align:center;
    padding:35px 15px !important;
    color:#718199;
}

.message{
    text-align:center;
    margin-top:12px;
    color:#718199;
    font-size:11px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:9px;
    margin-top:14px;
}

.action-btn{
    text-decoration:none;
    text-align:center;
    padding:12px 9px;
    border-radius:13px;
    font-weight:900;
    font-size:11px;
}

.deposit-btn{
    background:#e5f1ff;
    color:#1d4ed8;
}

.wallet-btn{
    background:#e8fff4;
    color:#087a52;
}

.dashboard-btn{
    background:#f0e9ff;
    color:#6d28d9;
}

@media(max-width:850px){

    .summary{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:560px){

    .header{
        padding:13px 12px;
    }

    .header h1{
        font-size:17px;
    }

    .container{
        padding:14px 10px 30px;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

    .summary-card{
        padding:11px;
    }

    .summary-value{
        font-size:17px;
    }

    .actions{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>Sathi Pay</h1>

    <a href="dashboard.html">
        Dashboard
    </a>

</header>


<main class="container">


<section class="page-title">

    <h2>
        Transaction History
    </h2>

    <p>
        Welcome bonus, deposits, commission, referral income and payment transactions
    </p>

</section>


<section class="summary">


    <div class="summary-card">

        <div class="summary-label">
            Welcome Bonus
        </div>

        <div
            class="summary-value purple"
            id="totalBonus">
            ₹0.00
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Deposit
        </div>

        <div
            class="summary-value blue"
            id="totalDeposits">
            ₹0.00
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Commission
        </div>

        <div
            class="summary-value orange"
            id="totalCommission">
            ₹0.00
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Refer Commission
        </div>

        <div
            class="summary-value green"
            id="totalReferral">
            ₹0.00
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Total Transaction
        </div>

        <div
            class="summary-value red"
            id="totalTransactions">
            0
        </div>

    </div>


</section>


<section class="card">

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Type</th>

                    <th>Amount</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody id="transactionTable">

                <tr>

                    <td
                        colspan="4"
                        class="empty">
                        Loading transactions...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>


<div
    id="transactionMessage"
    class="message">
</div>


<div class="actions">

    <a
        class="action-btn deposit-btn"
        href="deposit.html">
        💳 New Deposit
    </a>

    <a
        class="action-btn wallet-btn"
        href="wallet.html">
        💰 Wallet
    </a>

    <a
        class="action-btn dashboard-btn"
        href="dashboard.html">
        🏠 Dashboard
    </a>

</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function money(value){

    return "₹" +
        Number(value || 0).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatDateTime(value){

    if(!value) return "";

    const date =
        new Date(value);

    if(isNaN(date.getTime())){
        return "";
    }

    const parts = new Intl.DateTimeFormat(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            hour12:true,
            timeZone:"Asia/Kolkata"
        }
    ).formatToParts(date);

    const getPart = function(name){
        const item = parts.find(function(p){ return p.type === name; });
        return item ? item.value : "";
    };

    return {
        day: getPart("day") + " " + getPart("month") + " " + getPart("year"),
        time: getPart("hour") + ":" + getPart("minute") + " " + getPart("dayPeriod")
    };

}


function statusClass(status){

    const value =
        String(status || "")
            .toLowerCase();

    if(value === "approved"){
        return "status-approved";
    }

    if(value === "success" ||
       value === "successful"){
        return "status-success";
    }

    if(value === "pending"){
        return "status-pending";
    }

    if(value === "rejected" ||
       value === "failed"){
        return "status-rejected";
    }

    return "status-default";

}


function typeIcon(type){

    const value =
        String(type || "")
            .toLowerCase();

    if(value.includes("welcome")){
        return "🎁";
    }

    if(value === "deposit"){
        return "💰";
    }

    if(value === "commission"){
        return "📈";
    }

    if(value.includes("referral")){
        return "👥";
    }

    if(value === "sell"){
        return "📤";
    }

    if(value.includes("upi")){
        return "📲";
    }

    return "₹";

}


async function loadTransactions(){

    const table =
        document.getElementById(
            "transactionTable"
        );

    const message =
        document.getElementById(
            "transactionMessage"
        );

    table.innerHTML = `
        <tr>
            <td colspan="4" class="empty">
                Loading transactions...
            </td>
        </tr>
    `;

    try{

        /*
         * Load the customer's real records directly using the
         * authenticated customer ID. The current database schema
         * stores customers.id as the Supabase auth user UUID.
         * This avoids the transaction RPC becoming a single point
         * of failure while keeping RLS protection on the tables.
         */

        const customerId =
            typeof getCustomerId === "function"
                ? getCustomerId()
                : localStorage.getItem("sathiPayCustomerId");

        if(!customerId){
            throw new Error("Customer session not found.");
        }

        const [
            depositsResult,
            ledgerResult
        ] = await Promise.all([

            supabaseClient
                .from("customer_deposits")
                .select(
                    "id, amount, status, utr, created_at"
                )
                .eq(
                    "customer_id",
                    customerId
                )
                .order(
                    "created_at",
                    {ascending:false}
                )
                .limit(500),

            supabaseClient
                .from("wallet_ledger")
                .select(
                    "id, component, direction, amount, reason, reference, created_at"
                )
                .eq(
                    "customer_id",
                    customerId
                )
                .order(
                    "created_at",
                    {ascending:false}
                )
                .limit(500)

        ]);

        if(depositsResult.error){
            throw depositsResult.error;
        }

        if(ledgerResult.error){
            throw ledgerResult.error;
        }

        const records = [];

        (depositsResult.data || []).forEach(function(row){

            records.push({
                event_id:
                    "deposit-" + row.id,
                event_type:
                    "Deposit",
                direction:
                    String(row.status || "").toLowerCase() === "approved"
                        ? "credit"
                        : "info",
                amount:
                    Number(row.amount || 0),
                status:
                    row.status || "pending",
                description:
                    "Deposit",
                reference:
                    "DEPOSIT-" + row.id,
                utr:
                    row.utr || "",
                upi_id:
                    "",
                commission:
                    0,
                created_at:
                    row.created_at
            });

        });

        (ledgerResult.data || []).forEach(function(row){

            /* Deposit is already represented by customer_deposits.
               Skip its matching wallet-ledger credit so history cannot
               display the same deposit twice. */
            if(
                String(row.component || "").toLowerCase() === "deposit"
            ){
                return;
            }


            const component =
                String(row.component || "").toLowerCase();

            const direction =
                String(row.direction || "").toLowerCase();

            let eventType =
                "Transaction";

            const reason =
                String(row.reason || "").toLowerCase();

            const reference =
                String(row.reference || "").toUpperCase();

            const isUpiPayment =
                component === "manual" &&
                direction === "debit" &&
                (
                    reason.includes("upi payment") ||
                    reference.indexOf("UPI-PAY-") === 0
                );

            const isLegacyWithdrawal =
                direction === "debit" &&
                (
                    component === "withdrawal" ||
                    reason.includes("withdrawal") ||
                    reason.includes("withdraw") ||
                    reference.indexOf("WITHDRAWAL") === 0 ||
                    reference.indexOf("WITHDRAW") === 0
                );

            /* Old withdrawal ledger entries are intentionally not
               shown because the final customer product has no
               withdrawal system/history. */
            if(isLegacyWithdrawal){
                return;
            }

            if(component === "bonus"){
                eventType = "Welcome Bonus";
            }
            else if(component === "commission"){
                eventType = "Commission";
            }
            else if(component === "referral"){
                eventType = "Referral Commission";
            }
            else if(isUpiPayment){
                eventType = "UPI Payment";
            }
            else if(
                component === "manual" &&
                direction === "debit"
            ){
                eventType = "Sell";
            }
            else if(
                component === "manual" &&
                direction === "credit"
            ){
                eventType = "Wallet Credit";
            }
            else if(component){
                eventType =
                    component.charAt(0).toUpperCase() +
                    component.slice(1);
            }

            records.push({
                event_id:
                    "ledger-" + row.id,
                event_type:
                    eventType,
                direction:
                    direction || "info",
                amount:
                    Number(row.amount || 0),
                status:
                    isUpiPayment
                    ? "Success"
                    : (
                        component === "manual" &&
                        direction === "debit"
                    )
                    ? "Sell Success"
                    : "success",
                description:
                    isUpiPayment
                    ? "UPI Payment"
                    : (
                        component === "manual" &&
                        direction === "debit"
                    )
                    ? "Sell Success"
                    : (
                        row.reason ||
                        "Wallet Transaction"
                    ),
                reference:
                    row.reference || "",
                utr:
                    "",
                upi_id:
                    "",
                commission:
                    component === "commission"
                        ? Number(row.amount || 0)
                        : 0,
                created_at:
                    row.created_at
            });

        });

        records.sort(function(a,b){
            return new Date(b.created_at) -
                   new Date(a.created_at);
        });

        let bonus = 0;
        let deposits = 0;
        let commission = 0;
        let referral = 0;

        records.forEach(function(row){

            const type =
                String(row.event_type || "").toLowerCase();

            const amount =
                Number(row.amount || 0);

            const status =
                String(row.status || "").toLowerCase();

            if(
                type === "welcome bonus" &&
                row.direction === "credit"
            ){
                bonus += amount;
            }

            if(
                type === "deposit" &&
                row.direction === "credit" &&
                status === "approved"
            ){
                deposits += amount;
            }

            if(
                type === "commission" &&
                row.direction === "credit"
            ){
                commission += amount;
            }

            if(
                type.includes("referral") &&
                row.direction === "credit"
            ){
                referral += amount;
            }

        });

        document.getElementById(
            "totalBonus"
        ).innerText =
            money(bonus);

        document.getElementById(
            "totalDeposits"
        ).innerText =
            money(deposits);

        document.getElementById(
            "totalCommission"
        ).innerText =
            money(commission);

        document.getElementById(
            "totalReferral"
        ).innerText =
            money(referral);

        document.getElementById(
            "totalTransactions"
        ).innerText =
            records.length;

        if(!records.length){

            table.innerHTML = `
                <tr>
                    <td colspan="4" class="empty">
                        No transactions found.
                    </td>
                </tr>
            `;

            message.innerText =
                "No transactions available.";

            return;
        }

        table.innerHTML = "";

        records.forEach(function(row){

            const tr =
                document.createElement("tr");

            const direction =
                String(row.direction || "").toLowerCase();

            const isCredit =
                direction === "credit";

            const amount =
                Number(row.amount || 0);

            const typeText =
                String(row.event_type || "Transaction");

            const description =
                String(
                    row.description ||
                    row.reference ||
                    ""
                );

            const status =
                String(
                    row.status ||
                    "success"
                );

            tr.innerHTML = `
                <td>
                    <div class="date">
                        <div class="date-day">${escapeHtml(formatDateTime(row.created_at).day)}</div>
                        <div class="date-time">${escapeHtml(formatDateTime(row.created_at).time)}</div>
                    </div>
                </td>

                <td>
                    <div class="type">
                        <span class="type-icon">${typeIcon(typeText)}</span>
                        <span class="type-name">${escapeHtml(typeText)}</span>
                    </div>
                </td>

                <td>
                    <span class="${isCredit ? "credit" : "debit"}">
                        ${isCredit ? "+" : "-"} ${money(amount)}
                    </span>
                </td>

                <td>
                    <span class="status ${statusClass(status)}">${escapeHtml(status)}</span>
                </td>
            `;

            table.appendChild(tr);

        });

        message.innerText =
            records.length +
            " transaction(s) loaded.";

    }
    catch(error){

        console.error(
            "Transaction error:",
            error
        );

        table.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    Unable to load transaction history.
                </td>
            </tr>
        `;

        message.innerText =
            "Unable to load transaction history.";

    }

}

loadTransactions();

</script>


</body>

</html>
