<!DOCTYPE html>
<html lang="en">

<body>

    <header>
        <h1>Transactions</h1>
        <a href="admin.html">Dashboard</a>

        <table>

                    <th>ID</th>

            <tbody>

                <tr>
                    <td>TX001</td>
                    <td>Agent One</td>
                    <td>Deposit</td>

                <tr>
                    <td>TX002</td>
                    <td>Agent Two</td>

                    <td>₹5,000</td>

                <tr>
                    <td>TX003</td>
                    <td>Agent Three</td>

                </tr>

            </tbody>

        </table>

    </main>
