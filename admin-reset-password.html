<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sathi Pay - Reset Admin Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:20px;
    padding:30px 24px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.lock{
    font-size:55px;
}

h1{
    margin:8px 0;
    font-size:27px;
    color:#172033;
}

.subtitle{
    color:#6b7280;
    font-size:15px;
}

label{
    display:block;
    margin:18px 0 8px;
    font-weight:bold;
    color:#374151;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    margin-top:24px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2563eb;
    text-decoration:none;
}

.rules{
    margin-top:14px;
    padding:12px;
    border-radius:12px;
    background:#f8fafc;
    color:#64748b;
    font-size:12px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="box">

    <div class="header">
        <div class="lock">🔐</div>

        <h1>Reset Admin Password</h1>

        <div class="subtitle">
            Create a new secure password
        </div>
    </div>


    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            minlength="8"
            required
        >


        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            minlength="8"
            required
        >


        <button
            type="submit"
            id="resetBtn">

            🔑 Update Password

        </button>

    </form>


    <div class="rules">
        Password must contain at least 8 characters.
    </div>


    <div id="message"></div>


    <a
        class="back"
        href="admin-login.html">

        ← Back to Admin Login

    </a>

</div>


<script>

const SUPABASE_URL =
    "https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById("resetForm");

const resetBtn =
    document.getElementById("resetBtn");

const message =
    document.getElementById("message");


let recoveryReady = false;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.textContent = text;

    if(type === "success"){

        message.style.color = "#16a34a";

    }else{

        message.style.color = "#dc2626";

    }

}


/* =========================
   CHECK RECOVERY SESSION
========================= */

async function checkRecoverySession(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if(error){

        console.error(error);

        showMessage(
            "❌ Password reset session could not be verified.",
            "error"
        );

        return;

    }


    if(data && data.session){

        recoveryReady = true;

        return;

    }


    showMessage(
        "❌ This password reset link is invalid or has expired. Please request a new reset link.",
        "error"
    );

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
    async function(event,session){

        if(event === "PASSWORD_RECOVERY"){

            recoveryReady = true;

            showMessage(
                "✅ Reset link verified. Enter your new password.",
                "success"
            );

        }

        if(
            event === "SIGNED_IN" &&
            session
        ){

            recoveryReady = true;

        }

    }
);


/* =========================
   UPDATE PASSWORD
========================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const password =
            document.getElementById(
                "password"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if(password.length < 8){

            showMessage(
                "❌ Password must be at least 8 characters.",
                "error"
            );

            return;

        }


        if(password !== confirmPassword){

            showMessage(
                "❌ Passwords do not match.",
                "error"
            );

            return;

        }


        resetBtn.disabled = true;

        resetBtn.textContent =
            "Updating...";


        try{

            const {
                data: sessionData
            } =
                await supabaseClient.auth.getSession();


            if(
                !sessionData ||
                !sessionData.session
            ){

                throw new Error(
                    "Reset session is missing or expired. Please request a new password reset link."
                );

            }


            const {
                error
            } =
                await supabaseClient.auth.updateUser({
                    password:password
                });


            if(error){

                throw error;

            }


            showMessage(
                "✅ Password updated successfully. Please login again.",
                "success"
            );


            form.reset();


            setTimeout(
                async function(){

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "admin-login.html";

                },
                1500
            );


        }catch(error){

            console.error(error);

            showMessage(
                "❌ " +
                (
                    error.message ||
                    "Unable to update password."
                ),
                "error"
            );


            resetBtn.disabled = false;

            resetBtn.textContent =
                "🔑 Update Password";

        }

    }
);


/* =========================
   INITIAL CHECK
========================= */

checkRecoverySession();

</script>

</body>
  </html>
