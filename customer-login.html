<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Customer Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header>
        <h1>Sathi Pay</h1>

        <a href="customer-register.html">
            Register
        </a>
    </header>

    <main class="container">

        <h2>Customer Login</h2>

        <form id="customerLoginForm">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="customerEmail"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="customerPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="customerLoginMessage"></p>

        <p>
            Don't have an account?
            <a href="customer-register.html">
                Register here
            </a>
        </p>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Sathi Pay App -->
    <script src="js/app.js?v=3"></script>


    <script>

        const loginForm =
            document.getElementById(
                "customerLoginForm"
            );


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "customerEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "customerPassword"
                    ).value;


                const message =
                    document.getElementById(
                        "customerLoginMessage"
                    );


                message.innerText =
                    "Logging in...";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {

                    console.error(error);

                    message.innerText =
                        "Login failed: " +
                        error.message;

                    return;
                }


                if (!data.user) {

                    message.innerText =
                        "Login failed.";

                    return;
                }


                message.innerText =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1000);

            }
        );

    </script>

</body>

</html>
