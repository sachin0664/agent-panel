<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Customer Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>Sathi Pay</h1>

    <a href="customer-register.html">
        Register
    </a>

</header>



<main class="container">

    <h2>Customer Login</h2>


    <form id="customerLoginForm">

        <label>
            Email Address
        </label>

        <input
            type="email"
            id="customerEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="customerPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>


    <p id="customerLoginMessage"></p>


    <p>
        Don't have an account?
        <a href="customer-register.html">
            Register here
        </a>
    </p>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=6"></script>


<script>


const loginForm =
    document.getElementById("customerLoginForm");


const message =
    document.getElementById("customerLoginMessage");


const loginButton =
    document.getElementById("loginButton");



loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.innerText = "";
        message.style.color = "";



        const email =
            document
                .getElementById("customerEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("customerPassword")
                .value;



        if (!email || !password) {

            message.innerText =
                "Please enter email and password.";

            message.style.color =
                "red";

            return;

        }



        loginButton.disabled = true;

        loginButton.innerText =
            "Logging in...";


        message.innerText =
            "Checking login...";

        message.style.color =
            "#2563eb";



        try {


            /* =====================================
               SUPABASE AUTH LOGIN
            ===================================== */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });



            if (error) {

                console.error(
                    "Supabase Login Error:",
                    error
                );


                if (
                    error.message &&
                    error.message
                        .toLowerCase()
                        .includes("invalid login credentials")
                ) {

                    message.innerText =
                        "Invalid email or password.";

                }

                else if (
                    error.message &&
                    error.message
                        .toLowerCase()
                        .includes("email not confirmed")
                ) {

                    message.innerText =
                        "Email verification is required.";

                }

                else {

                    message.innerText =
                        "Login failed: " +
                        error.message;

                }


                message.style.color =
                    "red";


                return;

            }



            if (
                !data ||
                !data.user ||
                !data.user.id
            ) {

                message.innerText =
                    "Login failed. Customer account not found.";

                message.style.color =
                    "red";

                return;

            }



            /* =====================================
               LOAD CUSTOMER PROFILE
            ===================================== */

            const {
                data: customer,
                error: customerError
            } =
                await supabaseClient

                    .from("customers")

                    .select(`
                        id,
                        uid,
                        name,
                        mobile,
                        invitation_code,
                        wallet_balance,
                        bonus_balance,
                        deposit_balance,
                        commission_balance,
                        referral_balance,
                        withdrawal_balance,
                        sell_on,
                        upi_id,
                        qr_code_url,
                        status
                    `)

                    .eq(
                        "id",
                        data.user.id
                    )

                    .maybeSingle();



            if (customerError) {

                console.error(
                    "Customer Profile Error:",
                    customerError
                );


                message.innerText =
                    "Login successful, but customer profile could not be loaded.";

                message.style.color =
                    "red";


                await supabaseClient.auth.signOut();

                return;

            }



            if (!customer) {

                message.innerText =
                    "Customer profile not found.";

                message.style.color =
                    "red";


                await supabaseClient.auth.signOut();

                return;

            }



            /* =====================================
               SAVE CUSTOMER SESSION DATA
            ===================================== */

            localStorage.setItem(
                "sathiPayCustomerId",
                customer.id
            );


            localStorage.setItem(
                "sathiPayUID",
                customer.uid || ""
            );


            localStorage.setItem(
                "sathiPayCustomerName",
                customer.name || ""
            );


            localStorage.setItem(
                "sathiPayCustomerMobile",
                customer.mobile || ""
            );


            localStorage.setItem(
                "sathiPayInvitationCode",
                customer.invitation_code || ""
            );



            /* =====================================
               LOGIN SUCCESS
            ===================================== */

            message.innerText =
                "✅ Login successful!";

            message.style.color =
                "green";


            loginButton.innerText =
                "Success";


            /* FINAL CUSTOMER DASHBOARD */

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 500);


        }


        catch (error) {

            console.error(
                "Login Exception:",
                error
            );


            message.innerText =
                "Login failed. Please try again.";

            message.style.color =
                "red";

        }


        finally {

            loginButton.disabled =
                false;

            if (
                loginButton.innerText !==
                "Success"
            ) {

                loginButton.innerText =
                    "Login";

            }

        }

    }
);


</script>


</body>

    </html>
