<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Customer Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <h1>Sathi Pay</h1>

    <a href="customer-register.html">
        Register
    </a>

</header>


<main class="container">

    <h2>Customer Login</h2>


    <form id="customerLoginForm">

        <label>
            Email Address
        </label>

        <input
            type="email"
            id="customerEmail"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="customerPassword"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="customerLoginMessage"></p>


    <p>
        Don't have an account?
        <a href="customer-register.html">
            Register here
        </a>
    </p>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=5"></script>


<script>

const loginForm =
    document.getElementById("customerLoginForm");

const message =
    document.getElementById("customerLoginMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "customerEmail"
            ).value.trim();


        const password =
            document.getElementById(
                "customerPassword"
            ).value;


        message.innerText =
            "Logging in...";


        try {

            /* ==============================
               SUPABASE AUTH LOGIN
            ============================== */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                console.error(error);

                message.innerText =
                    "Login failed: " +
                    error.message;

                return;
            }


            if (!data.user) {

                message.innerText =
                    "Login failed.";

                return;
            }


            /* ==============================
               LOAD CUSTOMER PROFILE
            ============================== */

            const {
                data: customer,
                error: customerError
            } =
                await supabaseClient
                    .from("customers")
                    .select(`
                        id,
                        uid,
                        name,
                        mobile,
                        invitation_code,
                        wallet_balance,
                        bonus_balance,
                        deposit_balance,
                        commission_balance,
                        referral_balance,
                        withdrawal_balance,
                        sell_on,
                        upi_id,
                        qr_code_url,
                        status
                    `)
                    .eq(
                        "id",
                        data.user.id
                    )
                    .maybeSingle();


            if (customerError) {

                console.error(
                    "Customer profile error:",
                    customerError
                );

                message.innerText =
                    "Login successful, but customer profile could not be loaded.";

                return;
            }


            if (!customer) {

                message.innerText =
                    "Customer profile not found.";

                return;
            }


            /* ==============================
               SAVE CUSTOMER SESSION INFO
            ============================== */

            localStorage.setItem(
                "sathiPayCustomerId",
                customer.id
            );


            localStorage.setItem(
                "sathiPayUID",
                customer.uid
            );


            localStorage.setItem(
                "sathiPayInvitationCode",
                customer.invitation_code || ""
            );


            localStorage.setItem(
                "sathiPayCustomerName",
                customer.name || ""
            );


            localStorage.setItem(
                "sathiPayCustomerMobile",
                customer.mobile || ""
            );


            /* ==============================
               LOGIN SUCCESS
            ============================== */

            message.innerText =
                "Login successful!";


            setTimeout(function() {

                window.location.href =
                    "deshboard.html";

            }, 700);

        }


        catch (error) {

            console.error(error);

            message.innerText =
                "Login failed: " +
                error.message;

        }

    }
);

</script>

</body>

</html>
