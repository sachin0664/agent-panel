<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Customer Login</title>

    <link

<style>

.customer-login-page .header-register{border:1px solid rgba(255,255,255,.48)!important;background:rgba(255,255,255,.12)!important;color:#fff!important;border-radius:16px!important;padding:13px 22px!important;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.customer-login-page .brand-mini-logo{width:60px!important;height:60px!important;border-radius:18px!important;background:transparent!important;box-shadow:0 8px 22px rgba(7,70,210,.25)!important}

.customer-login-page .login-card{max-width:650px!important;margin:0 auto!important;background:rgba(255,255,255,.94)!important;border:1px solid rgba(255,255,255,.9)!important;border-radius:34px!important;box-shadow:0 24px 70px rgba(35,92,170,.18)!important;padding:42px 44px 34px!important;position:relative!important;overflow:hidden!important}
.customer-login-page .login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#087ff5,#7b35f5,#10d99c,#ffd34d)}
.customer-login-page .login-card-top{text-align:center!important}
.customer-login-page .login-logo{width:116px!important;height:116px!important;margin:0 auto 14px!important;border-radius:30px!important;background:transparent!important;box-shadow:0 16px 32px rgba(34,92,190,.16)!important}
.customer-login-page .login-logo img{width:116px!important;height:116px!important;object-fit:contain!important}
.customer-login-page .login-kicker{display:inline-block!important;padding:8px 24px!important;border-radius:999px!important;background:linear-gradient(90deg,#eef7ff,#e8fff6)!important;color:#1672ad!important;font-weight:900!important;letter-spacing:4px!important}
.customer-login-page .login-card h2{font-size:46px!important;line-height:1.05!important;margin:14px 0 10px!important;font-weight:900!important;background:linear-gradient(90deg,#102a56,#087ff5,#10b982)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.customer-login-page .login-card-top p{font-size:18px!important;color:#657895!important;margin-bottom:28px!important}
.customer-login-page form label{display:block!important;font-weight:850!important;color:#17345f!important;margin:18px 0 8px!important}
.customer-login-page form input{width:100%!important;border:2px solid #dceaff!important;background:#f9fcff!important;border-radius:20px!important;padding:18px 20px!important;font-size:17px!important;outline:none!important;transition:.2s!important}
.customer-login-page form input:focus{border-color:#1a8bf2!important;box-shadow:0 0 0 4px rgba(26,139,242,.10)!important;background:#fff!important}
.customer-login-page #loginButton{width:100%!important;border:0!important;border-radius:20px!important;padding:17px!important;margin-top:24px!important;background:linear-gradient(100deg,#087ff5,#5538f5,#11d994)!important;color:#fff!important;font-size:20px!important;font-weight:900!important;box-shadow:0 14px 28px rgba(35,114,230,.22)!important}
.customer-login-page .login-actions{margin-top:20px!important}
.customer-login-page .login-actions a{color:#126dcc!important;font-weight:850!important}
.customer-login-page .secure-note{background:#e9fff7!important;color:#16956e!important;border-radius:999px!important;padding:10px 16px!important}
.customer-login-page .register-box{background:linear-gradient(100deg,#eef8ff,#effcf8)!important;border:1px solid #d8edf4!important;border-radius:22px!important;margin-top:34px!important;padding:18px!important;text-align:center!important}
.customer-login-page .login-trust-row{color:#66809f!important}
@media(max-width:700px){
.customer-login-page .brand-header{padding:10px 14px!important}
.customer-login-page .brand-mini-logo,.customer-login-page .brand-mini-logo img{width:54px!important;height:54px!important}
.customer-login-page .login-page-shell{padding:34px 14px 46px!important}
.customer-login-page .login-card{padding:36px 22px 28px!important;border-radius:28px!important}
.customer-login-page .login-logo,.customer-login-page .login-logo img{width:108px!important;height:108px!important}
.customer-login-page .login-card h2{font-size:38px!important}
}
</style>
</head>


<body class="customer-login-page">

<header class="brand-header">
    <div class="brand-header-left">
        <div class="brand-mini-logo"><img src="assets/sathipay-logo-exact.svg?v=9" alt="Sathi Pay"></div>
        <div>
            <div class="brand-name"><span>Sathi</span> <b>Pay</b></div>
            <div class="brand-tagline">SAFE • FAST • TOGETHER</div>
        </div>
    </div>
    <a class="header-register" href="customer-register.html">Register</a>
</header>

<main class="login-page-shell">
    <section class="login-card">
        <div class="login-card-top">
            <div class="login-logo"><img src="assets/sathipay-logo-exact.svg?v=9" alt="Sathi Pay"></div>
            <div class="login-kicker">WELCOME BACK</div>
            <h2>Customer Login</h2>
            <p>Securely access your Sathi Pay account</p>
        </div>


    <!-- LOGIN FORM -->

    <form id="customerLoginForm">

        <label>
            Email Address
        </label>

        <input
            type="email"
            id="customerEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="customerPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>

    </form>

    <!-- FORGOT PASSWORD -->

    <div class="login-actions">
        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
        <span class="secure-note">🔒 Secure Login</span>
    </div>


    <p id="customerLoginMessage" class="login-message"></p>

    <div class="register-box">
        <span>Don't have an account?</span>
        <a href="customer-register.html">Create your account</a>
    </div>

    <div class="login-trust-row">
        <span>✓ Protected account</span>
        <span>✓ Fast access</span>
        <span>✓ Sathi Pay</span>
    </div>
    </section>
</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=6"></script>


<script>


/* =====================================
   LOGIN ELEMENTS
===================================== */

const loginForm =
    document.getElementById("customerLoginForm");


const message =
    document.getElementById("customerLoginMessage");


const loginButton =
    document.getElementById("loginButton");


const forgotPasswordLink =
    document.getElementById("forgotPasswordLink");



/* =====================================
   CUSTOMER LOGIN
===================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.innerText = "";
        message.style.color = "";



        const email =
            document
                .getElementById("customerEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("customerPassword")
                .value;



        if (!email || !password) {

            message.innerText =
                "Please enter email and password.";

            message.style.color =
                "red";

            return;

        }



        loginButton.disabled = true;

        loginButton.innerText =
            "Logging in...";


        message.innerText =
            "Checking login...";

        message.style.color =
            "#2563eb";



        try {


            /* =====================================
               SUPABASE AUTH LOGIN
            ===================================== */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });



            if (error) {

                console.error(
                    "Supabase Login Error:",
                    error
                );


                if (
                    error.message &&
                    (
                        error.message.toLowerCase().includes("user is banned") ||
                        error.message.toLowerCase().includes("banned")
                    )
                ) {

                    message.innerText =
                        "This account is blocked.\\nPlease contact customer support.";

                }

                else if (
                    error.message &&
                    error.message
                        .toLowerCase()
                        .includes("invalid login credentials")
                ) {

                    message.innerText =
                        "Invalid email or password.";

                }

                else if (
                    error.message &&
                    error.message
                        .toLowerCase()
                        .includes("email not confirmed")
                ) {

                    message.innerText =
                        "Email verification is required.";

                }

                else {

                    message.innerText =
                        "Login failed: " +
                        error.message;

                }


                message.style.color =
                    "red";


                return;

            }



            if (
                !data ||
                !data.user ||
                !data.user.id
            ) {

                message.innerText =
                    "Login failed. Customer account not found.";

                message.style.color =
                    "red";

                return;

            }



            /* =====================================
               LOAD CUSTOMER PROFILE
            ===================================== */

            const {
                data: customer,
                error: customerError
            } =
                await supabaseClient

                    .from("customers")

                    .select(`
                        id,
                        uid,
                        name,
                        mobile,
                        invitation_code,
                        wallet_balance,
                        bonus_balance,
                        deposit_balance,
                        commission_balance,
                        referral_balance,
                        sell_on,
                        upi_id,
                        qr_code_url,
                        status
                    `)

                    .eq(
                        "id",
                        data.user.id
                    )

                    .maybeSingle();



            if (customerError) {

                console.error(
                    "Customer Profile Error:",
                    customerError
                );


                message.innerText =
                    "Login successful, but customer profile could not be loaded.";

                message.style.color =
                    "red";


                await supabaseClient.auth.signOut();

                return;

            }



            if (!customer) {

                message.innerText =
                    "Customer profile not found.";

                message.style.color =
                    "red";


                await supabaseClient.auth.signOut();

                return;

            }



            /* =====================================
               BLOCKED / DELETED CUSTOMER
            ===================================== */

            const customerStatus =
                String(
                    customer.status || ""
                ).toLowerCase();

            if(
                customerStatus === "blocked" ||
                customerStatus === "deleted" ||
                customerStatus === "inactive"
            ){

                await supabaseClient.auth.signOut();

                message.innerText =
                    "This account is blocked.\\nPlease contact customer support.";

                message.style.color =
                    "red";

                return;

            }



            /* =====================================
               SAVE CUSTOMER SESSION DATA
            ===================================== */

            localStorage.setItem(
                "sathiPayCustomerId",
                customer.id
            );


            localStorage.setItem(
                "sathiPayUID",
                customer.uid || ""
            );


            localStorage.setItem(
                "sathiPayCustomerName",
                customer.name || ""
            );


            localStorage.setItem(
                "sathiPayCustomerMobile",
                customer.mobile || ""
            );


            localStorage.setItem(
                "sathiPayInvitationCode",
                customer.invitation_code || ""
            );



            /* =====================================
               LOGIN SUCCESS
            ===================================== */

            message.innerText =
                "✅ Login successful!";

            message.style.color =
                "green";


            loginButton.innerText =
                "Success";


            /*
             * IMPORTANT:
             * Customer login ke baad
             * customer dashboard open hoga.
             */

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 500);


        }


        catch (error) {

            console.error(
                "Login Exception:",
                error
            );


            message.innerText =
                "Login failed. Please try again.";

            message.style.color =
                "red";

        }


        finally {

            loginButton.disabled =
                false;

            if (
                loginButton.innerText !==
                "Success"
            ) {

                loginButton.innerText =
                    "Login";

            }

        }

    }
);



/* =====================================
   FORGOT PASSWORD
===================================== */

forgotPasswordLink.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("customerEmail")
                .value
                .trim()
                .toLowerCase();



        if (!email) {

            message.innerText =
                "Please enter your email address first.";

            message.style.color =
                "red";

            document
                .getElementById("customerEmail")
                .focus();

            return;

        }



        forgotPasswordLink.style.pointerEvents =
            "none";

        forgotPasswordLink.innerText =
            "Sending reset link...";


        message.innerText =
            "Sending password reset link...";

        message.style.color =
            "#2563eb";



        try {


            /*
             * GitHub Pages URL:
             *
             * https://sachin0664.github.io/agent-panel/
             *
             * Reset page:
             *
             * https://sachin0664.github.io/agent-panel/reset-password.html
             */

            const resetUrl =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "customer-login.html",
                        ""
                    ) +
                "reset-password.html";



            const {
                error
            } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo: resetUrl
                        }
                    );



            if (error) {

                console.error(
                    "Password Reset Error:",
                    error
                );


                message.innerText =
                    "Unable to send reset link: " +
                    error.message;

                message.style.color =
                    "red";

                return;

            }



            message.innerText =
                "✅ Password reset link sent. Please check your email.";

            message.style.color =
                "green";


        }


        catch (error) {

            console.error(
                "Forgot Password Error:",
                error
            );


            message.innerText =
                "Something went wrong. Please try again.";

            message.style.color =
                "red";

        }


        finally {

            forgotPasswordLink.style.pointerEvents =
                "auto";

            forgotPasswordLink.innerText =
                "Forgot Password?";

        }

    }
);


</script>


</body>

    </html>
