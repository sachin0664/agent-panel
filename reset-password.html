<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Reset Password</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>Sathi Pay</h1>

    <a href="customer-login.html">
        Login
    </a>

</header>



<main class="container">

    <h2>Reset Password</h2>


    <p>
        Enter your new password below.
    </p>


    <form id="resetPasswordForm">


        <label>
            New Password
        </label>


        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            minlength="6"
            autocomplete="new-password"
            required
        >



        <label>
            Confirm New Password
        </label>


        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            autocomplete="new-password"
            required
        >



        <button
            type="submit"
            id="resetButton"
        >
            Update Password
        </button>


    </form>



    <p id="resetMessage"></p>



    <p>

        <a href="customer-login.html">
            Back to Login
        </a>

    </p>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js?v=6"></script>

<script>
localStorage.removeItem("sathiPayRecoveryType");
</script>


<script>
/*
 * SATHI PAY PASSWORD RECOVERY INITIALIZATION
 *
 * Supabase can return a PKCE "code" to the Site URL.
 * Exchange that code before allowing the customer to
 * submit the new password.
 */
(async function(){

    try{

        const params = new URLSearchParams(
            window.location.search
        );

        const code = params.get("code");

        if(code){

            const { error } =
                await supabaseClient.auth
                    .exchangeCodeForSession(code);

            if(error){

                console.error(
                    "Recovery Code Exchange Error:",
                    error
                );

                const msg =
                    document.getElementById("resetMessage");

                if(msg){
                    msg.innerText =
                        "This password reset link is invalid or expired. Please request a new reset link.";
                    msg.style.color = "red";
                }

                return;
            }

            /*
             * Remove the one-time code from the address bar
             * without leaving the reset page.
             */
            const cleanUrl =
                window.location.origin +
                window.location.pathname;

            window.history.replaceState(
                {},
                document.title,
                cleanUrl
            );
        }

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();

        if(!session){

            const msg =
                document.getElementById("resetMessage");

            if(msg){
                msg.innerText =
                    "This password reset link is invalid or expired. Please request a new reset link.";
                msg.style.color = "red";
            }

        }

    }
    catch(error){

        console.error(
            "Password Recovery Initialization Error:",
            error
        );

        const msg =
            document.getElementById("resetMessage");

        if(msg){
            msg.innerText =
                "Unable to open the password reset link. Please request a new one.";
            msg.style.color = "red";
        }

    }

})();
</script>

<script>


const resetForm =
    document.getElementById("resetPasswordForm");


const resetMessage =
    document.getElementById("resetMessage");


const resetButton =
    document.getElementById("resetButton");



/* =====================================
   PASSWORD RESET
===================================== */

resetForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        resetMessage.innerText = "";
        resetMessage.style.color = "";



        const newPassword =
            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;



        if (newPassword.length < 6) {

            resetMessage.innerText =
                "Password must be at least 6 characters.";

            resetMessage.style.color =
                "red";

            return;

        }



        if (
            newPassword !==
            confirmPassword
        ) {

            resetMessage.innerText =
                "Passwords do not match.";

            resetMessage.style.color =
                "red";

            return;

        }



        resetButton.disabled =
            true;

        resetButton.innerText =
            "Updating...";


        resetMessage.innerText =
            "Updating your password...";

        resetMessage.style.color =
            "#2563eb";



        try {


            /* =====================================
               UPDATE SUPABASE PASSWORD
            ===================================== */

            const {
                error
            } =
                await supabaseClient.auth
                    .updateUser({

                        password:
                            newPassword

                    });



            if (error) {

                console.error(
                    "Password Update Error:",
                    error
                );


                resetMessage.innerText =
                    "Password update failed: " +
                    error.message;

                resetMessage.style.color =
                    "red";

                return;

            }



            /* =====================================
               SUCCESS
            ===================================== */

            resetMessage.innerText =
                "✅ Password updated successfully.";

            resetMessage.style.color =
                "green";


            resetButton.innerText =
                "Password Updated";


            setTimeout(
                async function() {

                    await supabaseClient
                        .auth
                        .signOut();


                    window.location.href =
                        "customer-login.html";

                },
                1500
            );


        }


        catch (error) {

            console.error(
                "Reset Password Exception:",
                error
            );


            resetMessage.innerText =
                "Something went wrong. Please try again.";

            resetMessage.style.color =
                "red";

        }


        finally {

            if (
                resetButton.innerText !==
                "Password Updated"
            ) {

                resetButton.disabled =
                    false;

                resetButton.innerText =
                    "Update Password";

            }

        }

    }
);


</script>


</body>

</html>
