<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sathi Pay - Admin</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <h1>
            Sathi Pay - Admin
        </h1>

        <a href="index.html">
            Logout
        </a>

    </header>


    <main class="container">

        <h2>
            📊 Admin Dashboard
        </h2>


        <div class="dashboard-grid">


            <div class="card">

                <h3>
                    👥 Total Agents
                </h3>

                <p id="totalAgents">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    💰 Total Deposits
                </h3>

                <p id="totalDeposits">
                    ₹0
                </p>

            </div>


            <div class="card">

                <h3>
                    💸 Total Withdrawals
                </h3>

                <p id="totalWithdrawals">
                    ₹0
                </p>

            </div>


            <div class="card">

                <h3>
                    💵 Total Commission
                </h3>

                <p id="totalCommission">
                    ₹0
                </p>

            </div>


            <div class="card">

                <h3>
                    ⏳ Pending Deposits
                </h3>

                <p id="pendingDeposits">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    ⏳ Pending Withdrawals
                </h3>

                <p id="pendingWithdrawals">
                    0
                </p>

            </div>

        </div>


        <h2>
            ⚙️ Admin Menu
        </h2>


        <div class="admin-menu">

            <a href="agents.html">
                👥 Agent Management
            </a>

            <a href="deposit.html">
                💰 Deposit
            </a>

            <a href="withdrawal.html">
                💸 Withdrawal
            </a>

            <a href="commission.html">
                💵 Commission
            </a>

            <a href="transactions.html">
                🧾 Transactions
            </a>

        </div>


        <div class="status">

            <b>
                System Status:
            </b>

            <p>
                🟢 Online
            </p>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- APP JS -->

    <script src="js/app.js?v=3"></script>

</body>

</html>
