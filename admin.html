<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sathi Pay - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.header{
    background:#1d4ed8;
    color:white;
    padding:20px;
    border-radius:0 0 18px 18px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:7px 0 0;
    opacity:.9;
}

.card{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    font-size:20px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    margin-bottom:10px;
    outline:none;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 16px;
    font-size:15px;
    cursor:pointer;
}

.searchBtn{
    width:100%;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.green{
    background:#16a34a;
    color:white;
}

.red{
    background:#dc2626;
    color:white;
}

.blue{
    background:#2563eb;
    color:white;
}

.gray{
    background:#64748b;
    color:white;
}

.status{
    padding:12px;
    border-radius:10px;
    background:#eef2ff;
    margin-top:12px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.stat{
    padding:18px;
    border-radius:14px;
    background:white;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.statTitle{
    font-size:17px;
    font-weight:bold;
}

.statValue{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.agentBox{
    margin-top:18px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #e5e7eb;
}

.row:last-child{
    border-bottom:0;
}

.label{
    font-weight:bold;
}

.value{
    text-align:right;
}

.item{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
    background:#fafafa;
}

.actions{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.small{
    font-size:13px;
    color:#64748b;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="header">

    <h1>🛡️ Sathi Pay Admin Panel</h1>

    <p>Admin Management Dashboard</p>

</div>


<div class="container">


<!-- ================= SEARCH AGENT ================= -->

<div class="card">

    <h2>🔎 Search Agent</h2>

    <input
        id="agentUID"
        type="text"
        placeholder="Enter Agent UID"
        autocomplete="off"
    >

    <button
        class="searchBtn"
        onclick="searchAgent()"
    >
        Search
    </button>

    <div
        id="searchStatus"
        class="status"
    >
        Ready to search.
    </div>

    <div
        id="agentDetails"
        class="agentBox hidden"
    ></div>

</div>


<!-- ================= ADMIN TOTALS ================= -->

<div class="stat">

    <div class="statTitle">
        👥 Total Agents
    </div>

    <div
        id="totalAgents"
        class="statValue"
    >
        0
    </div>

</div>


<div class="stat">

    <div class="statTitle">
        💰 Total Deposits
    </div>

    <div
        id="totalDeposits"
        class="statValue"
    >
        ₹0.00
    </div>

</div>


<div class="stat">

    <div class="statTitle">
        💸 Total Withdrawals
    </div>

    <div
        id="totalWithdrawals"
        class="statValue"
    >
        ₹0.00
    </div>

</div>


<!-- ================= DEPOSIT REQUESTS ================= -->

<div class="card">

    <h2>💰 Deposit Requests</h2>

    <button
        class="blue"
        onclick="loadAdminDeposits()"
    >
        View Deposit Requests
    </button>

    <div id="adminDepositList">
    </div>

</div>


<!-- ================= WITHDRAWAL REQUESTS ================= -->

<div class="card">

    <h2>💸 Withdrawal Requests</h2>

    <button
        class="blue"
        onclick="loadAdminWithdrawals()"
    >
        View Withdrawal Requests
    </button>

    <div id="adminWithdrawalList">
    </div>

</div>


<!-- ================= ALL AGENTS ================= -->

<div class="card">

    <h2>👥 All Agents</h2>

    <button
        class="blue"
        onclick="loadAllAgents()"
    >
        View All Agents
    </button>

    <div id="allAgentsList">
    </div>

</div>


<!-- ================= AGENT TRANSACTIONS ================= -->

<div class="card">

    <h2>📊 Agent Transactions</h2>

    <input
        id="transactionUID"
        type="text"
        placeholder="Enter Agent UID"
    >

    <button
        class="blue"
        onclick="loadAgentTransactions()"
    >
        View Transactions
    </button>

    <div id="transactionList">
    </div>

</div>


<!-- ================= COMMISSION ================= -->

<div class="card">

    <h2>💵 Commission</h2>

    <div class="item">

        <b>Deposit Commission Rate</b>

        <div
            style="font-size:26px;font-weight:bold;margin-top:8px;"
        >
            10%
        </div>

        <div class="small">
            Approved deposit × 10%
        </div>

    </div>

</div>


</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   HELPERS
===================================================== */

function money(value){

    return "₹" +
        Number(value || 0)
        .toFixed(2);

}


function setStatus(message,type=""){

    const box =
        document.getElementById("searchStatus");

    box.className = "status " + type;

    box.textContent = message;

}


/* =====================================================
   SEARCH AGENT
===================================================== */

async function searchAgent(){

    const input =
        document.getElementById("agentUID");

    const uid =
        input.value
        .trim()
        .toUpperCase();

    const details =
        document.getElementById("agentDetails");

    details.classList.add("hidden");
    details.innerHTML = "";

    if(!uid){

        setStatus(
            "Please enter Agent UID.",
            "error"
        );

        return;
    }


    setStatus("Searching...");


    const {
        data:agent,
        error
    } = await supabaseClient

        .from("agents")

        .select(
            "id,uid,name,mobile,status"
        )

        .eq("uid",uid)

        .maybeSingle();


    if(error){

        setStatus(
            "Database error: " +
            error.message,
            "error"
        );

        return;
    }


    if(!agent){

        setStatus(
            "Agent not found.",
            "error"
        );

        return;
    }


    /* ---------- DEPOSITS ---------- */

    const {
        data:deposits
    } = await supabaseClient

        .from("deposits")

        .select(
            "id,amount,status"
        )

        .eq(
            "agent_id",
            agent.id
        )

        .order(
            "id",
            {ascending:false}
        );


    /* ---------- WITHDRAWALS ---------- */

    const {
        data:withdrawals
    } = await supabaseClient

        .from("withdrawals")

        .select(
            "id,amount,status"
        )

        .eq(
            "agent_id",
            agent.id
        )

        .order(
            "id",
            {ascending:false}
        );


    let totalDeposit = 0;
    let approvedDeposit = 0;

    (deposits || []).forEach(d => {

        const amount =
            Number(d.amount || 0);

        totalDeposit += amount;

        if(
            String(d.status)
            .toLowerCase()
            === "approved"
        ){

            approvedDeposit += amount;

        }

    });


    let approvedWithdrawal = 0;

    (withdrawals || []).forEach(w => {

        if(
            String(w.status)
            .toLowerCase()
            === "approved"
        ){

            approvedWithdrawal +=
                Number(w.amount || 0);

        }

    });


    const commission =
        approvedDeposit * 0.10;


    details.innerHTML = `

        <div class="card">

            <h2>👤 Agent Details</h2>

            <div class="row">
                <span class="label">ID</span>
                <span class="value">
                    ${agent.id}
                </span>
            </div>

            <div class="row">
                <span class="label">UID</span>
                <span class="value">
                    ${agent.uid || "-"}
                </span>
            </div>

            <div class="row">
                <span class="label">Name</span>
                <span class="value">
                    ${agent.name || "-"}
                </span>
            </div>

            <div class="row">
                <span class="label">Mobile</span>
                <span class="value">
                    ${agent.mobile || "-"}
                </span>
            </div>

            <div class="row">
                <span class="label">Status</span>
                <span class="value">
                    ${agent.status || "-"}
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Total Deposit
                </span>
                <span class="value">
                    ${money(totalDeposit)}
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Approved Deposit
                </span>
                <span class="value">
                    ${money(approvedDeposit)}
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Commission 10%
                </span>
                <span class="value">
                    ${money(commission)}
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Approved Withdrawal
                </span>
                <span class="value">
                    ${money(approvedWithdrawal)}
                </span>
            </div>

        </div>


        <div class="card">

            <h2>💰 Deposit History</h2>

            ${
                deposits &&
                deposits.length
                ?
                deposits.map(d => `

                    <div class="item">

                        <b>
                            Deposit #${d.id}
                        </b>

                        <br>

                        Amount:
                        ${money(d.amount)}

                        <br>

                        Status:
                        ${d.status}

                        <br>

                        Commission:
                        ${
                            String(d.status)
                            .toLowerCase()
                            === "approved"
                            ?
                            money(
                                Number(d.amount || 0)
                                * 0.10
                            )
                            :
                            "₹0.00"
                        }

                    </div>

                `).join("")
                :
                "<p>No deposits found.</p>"
            }

        </div>


        <div class="card">

            <h2>💸 Withdrawal History</h2>

            ${
                withdrawals &&
                withdrawals.length
                ?
                withdrawals.map(w => `

                    <div class="item">

                        <b>
                            Withdrawal #${w.id}
                        </b>

                        <br>

                        Amount:
                        ${money(w.amount)}

                        <br>

                        Status:
                        ${w.status}

                    </div>

                `).join("")
                :
                "<p>No withdrawals found.</p>"
            }

        </div>

    `;


    details.classList.remove("hidden");


    setStatus(
        "✅ Agent found successfully.",
        "success"
    );

}


/* =====================================================
   ADMIN TOTALS
===================================================== */

async function loadAdminTotals(){


    const {
        count:agentCount
    } = await supabaseClient

        .from("agents")

        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        );


    document.getElementById(
        "totalAgents"
    ).textContent =
        agentCount || 0;


    const {
        data:deposits
    } = await supabaseClient

        .from("deposits")

        .select("amount");


    let totalDeposit = 0;


    (deposits || []).forEach(d => {

        totalDeposit +=
            Number(d.amount || 0);

    });


    document.getElementById(
        "totalDeposits"
    ).textContent =
        money(totalDeposit);


    const {
        data:withdrawals
    } = await supabaseClient

        .from("withdrawals")

        .select("amount");


    let totalWithdrawal = 0;


    (withdrawals || []).forEach(w => {

        totalWithdrawal +=
            Number(w.amount || 0);

    });


    document.getElementById(
        "totalWithdrawals"
    ).textContent =
        money(totalWithdrawal);

}


/* =====================================================
   DEPOSIT REQUESTS
===================================================== */

async function loadAdminDeposits(){

    const box =
        document.getElementById(
            "adminDepositList"
        );

    box.innerHTML =
        "<p>Loading...</p>";


    const {
        data,
        error
    } = await supabaseClient

        .from("deposits")

        .select(
            "id,agent_id,amount,status"
        )

        .order(
            "id",
            {ascending:false}
        );


    if(error){

        box.innerHTML =
            "<div class='status error'>" +
            error.message +
            "</div>";

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
            "<p>No deposits found.</p>";

        return;
    }


    box.innerHTML = data.map(d => `

        <div class="item">

            <b>Deposit ID:</b>
            ${d.id}

            <br>

            <b>Agent ID:</b>
            ${d.agent_id}

            <br>

            <b>Amount:</b>
            ${money(d.amount)}

            <br>

            <b>Status:</b>
            ${d.status}

            <div class="actions">

                <button
                    class="green"
                    onclick="
                    updateDepositStatus(
                        ${d.id},
                        'approved'
                    )"
                >
                    Approve
                </button>

                <button
                    class="red"
                    onclick="
                    updateDepositStatus(
                        ${d.id},
                        'rejected'
                    )"
                >
                    Reject
                </button>

            </div>

        </div>

    `).join("");

}


/* =====================================================
   UPDATE DEPOSIT
===================================================== */

async function updateDepositStatus(
    id,
    status
){

    const {
        error
    } = await supabaseClient

        .from("deposits")

        .update({
            status:status
        })

        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "❌ " +
            error.message
        );

        return;
    }


    alert(
        "Deposit " +
        status +
        " successfully."
    );


    await loadAdminDeposits();

    await loadAdminTotals();

}


/* =====================================================
   WITHDRAWAL REQUESTS
===================================================== */

async function loadAdminWithdrawals(){

    const box =
        document.getElementById(
            "adminWithdrawalList"
        );

    box.innerHTML =
        "<p>Loading...</p>";


    const {
        data,
        error
    } = await supabaseClient

        .from("withdrawals")

        .select("*")

        .order(
            "id",
            {ascending:false}
        );


    if(error){

        box.innerHTML =
            "<div class='status error'>" +
            error.message +
            "</div>";

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
            "<p>No withdrawals found.</p>";

        return;
    }


    box.innerHTML = data.map(w => `

        <div class="item">

            <b>Withdrawal ID:</b>
            ${w.id}

            <br>

            <b>Agent ID:</b>
            ${w.agent_id ?? "-"}

            <br>

            <b>Amount:</b>
            ${money(w.amount)}

            <br>

            <b>Status:</b>
            ${w.status || "-"}

            <div class="actions">

                <button
                    class="green"
                    onclick="
                    updateWithdrawalStatus(
                        ${w.id},
                        'approved'
                    )"
                >
                    Approve
                </button>

                <button
                    class="red"
                    onclick="
                    updateWithdrawalStatus(
                        ${w.id},
                        'rejected'
                    )"
                >
                    Reject
                </button>

            </div>

        </div>

    `).join("");

}


/* =====================================================
   UPDATE WITHDRAWAL
===================================================== */

async function updateWithdrawalStatus(
    id,
    status
){

    const {
        error
    } = await supabaseClient

        .from("withdrawals")

        .update({
            status:status
        })

        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "❌ " +
            error.message
        );

        return;
    }


    alert(
        "Withdrawal " +
        status +
        " successfully."
    );


    await loadAdminWithdrawals();

    await loadAdminTotals();

}


/* =====================================================
   ALL AGENTS
===================================================== */

async function loadAllAgents(){

    const box =
        document.getElementById(
            "allAgentsList"
        );

    box.innerHTML =
        "<p>Loading...</p>";


    const {
        data,
        error
    } = await supabaseClient

        .from("agents")

        .select(
            "id,uid,name,mobile,status"
        )

        .order(
            "id",
            {ascending:false}
        );


    if(error){

        box.innerHTML =
            "<div class='status error'>" +
            error.message +
            "</div>";

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
            "<p>No agents found.</p>";
        return;
    }

    box.innerHTML = data.map(a => `

        <div class="item">

            <b>ID:</b>
            ${a.id}

            <br>

            <b>UID:</b>
            ${a.uid || "-"}

            <br>

            <b>Name:</b>
            ${a.name || "-"}

            <br>

            <b>Mobile:</b>
            ${a.mobile || "-"}

            <br>

            <b>Status:</b>
            ${a.status || "-"}

        </div>

    `).join("");

}


/* =====================================================
   AGENT TRANSACTIONS
===================================================== */

async function loadAgentTransactions(){

    const uid =
        document
        .getElementById("transactionUID")
        .value
        .trim()
        .toUpperCase();

    const box =
        document.getElementById("transactionList");

    if(!uid){

        box.innerHTML =
            "<div class='status error'>Enter Agent UID.</div>";

        return;
    }

    box.innerHTML = "<p>Searching...</p>";

    const {
        data:agent,
        error
    } = await supabaseClient
        .from("agents")
        .select("id,uid,name")
        .eq("uid",uid)
        .maybeSingle();

    if(error){

        box.innerHTML =
            "<div class='status error'>" +
            error.message +
            "</div>";

        return;
    }

    if(!agent){

        box.innerHTML =
            "<div class='status error'>" +
            "Agent not found." +
            "</div>";

        return;
    }

    const {
        data:deposits
    } = await supabaseClient
        .from("deposits")
        .select("id,amount,status")
        .eq("agent_id",agent.id)
        .order("id",{ascending:false});

    const {
        data:withdrawals
    } = await supabaseClient
        .from("withdrawals")
        .select("id,amount,status")
        .eq("agent_id",agent.id)
        .order("id",{ascending:false});

    let html = `

        <div class="item">

            <b>Agent:</b>
            ${agent.name || "-"}

            <br>

            <b>UID:</b>
            ${agent.uid}

        </div>

        <h3>💰 Deposits</h3>

    `;

    if(!deposits || !deposits.length){

        html += "<p>No deposits found.</p>";

    }else{

        deposits.forEach(d => {

            html += `

                <div class="item">

                    Deposit #${d.id}

                    <br>

                    Amount:
                    ${money(d.amount)}

                    <br>

                    Status:
                    ${d.status}

                    <br>

                    Commission:
                    ${
                        String(d.status).toLowerCase() === "approved"
                        ? money(Number(d.amount || 0) * 0.10)
                        : "₹0.00"
                    }

                </div>

            `;

        });

    }

    html += `<h3>💸 Withdrawals</h3>`;

    if(!withdrawals || !withdrawals.length){

        html += "<p>No withdrawals found.</p>";

    }else{

        withdrawals.forEach(w => {

            html += `

                <div class="item">

                    Withdrawal #${w.id}

                    <br>

                    Amount:
                    ${money(w.amount)}

                    <br>

                    Status:
                    ${w.status}

                </div>

            `;

        });

    }

    box.innerHTML = html;

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadAdminTotals();

    }
);

</script>

</body>
</html>
