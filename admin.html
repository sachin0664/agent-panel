<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sathi Pay - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#222;
    color:white;
    padding:22px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    font-size:26px;
}

header a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h2{
    margin-top:0;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.search-title{
    color:#1565c0;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:16px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:18px;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    position:relative;
    z-index:9999;
    pointer-events:auto;
}

button:active{
    transform:scale(.99);
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

.success{
    background:#e8f5e9;
    color:#15803d;
}

.error{
    background:#ffebee;
    color:#c62828;
}

.info{
    background:#e3f2fd;
    color:#1565c0;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stat-title{
    color:#1565c0;
    font-weight:bold;
    font-size:18px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

.result{
    margin-top:20px;
}

.agent-box{
    background:#f8fafc;
    border-radius:12px;
    padding:18px;
}

.agent-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.agent-row:last-child{
    border-bottom:0;
}

.label{
    font-weight:bold;
}

.uid{
    color:#1565c0;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#e3eaf2;
}

.approved{
    color:#15803d;
    font-weight:bold;
}

.pending{
    color:#b45309;
    font-weight:bold;
}

.rejected{
    color:#dc2626;
    font-weight:bold;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    header h1{
        font-size:22px;
    }

}

</style>

</head>


<body>


<header>

<h1>Sathi Pay - Admin</h1>

<a href="admin.html">
Dashboard
</a>

</header>


<div class="container">


<h2>📊 Admin Dashboard</h2>


<!-- SEARCH -->

<div class="card">

<div class="search-title">
🔎 Search Agent by UID
</div>


<input
type="text"
id="uidInput"
placeholder="Enter Agent UID"
value=""
autocomplete="off"
>


<button
type="button"
id="searchButton"
onclick="searchAgent()"
>
Search
</button>


<div
id="message"
class="message info"
>
Ready to search.
</div>


<div
id="searchResult"
class="result"
>
</div>


</div>


<!-- TOTALS -->

<div class="stats">


<div class="stat">

<div class="stat-title">
👥 Total Agents
</div>

<div
class="stat-value"
id="totalAgents"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
💰 Total Deposits
</div>

<div
class="stat-value"
id="totalDeposits"
>
₹0.00
</div>

</div>


<div class="stat">

<div class="stat-title">
💸 Total Withdrawals
</div>

<div
class="stat-value"
id="totalWithdrawals"
>
₹0.00
</div>

</div>


</div>


</div>


<script>


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================
   ELEMENTS
===================================== */

const uidInput =
document.getElementById("uidInput");

const searchButton =
document.getElementById("searchButton");

const message =
document.getElementById("message");

const searchResult =
document.getElementById("searchResult");


/* =====================================
   NORMALIZE UID
===================================== */

function normalizeUID(uid){

return String(uid || "")
.trim()
.toUpperCase()
.replace(/\s+/g,"");

}


/* =====================================
   SEARCH AGENT
===================================== */

async function searchAgent(){

const enteredUID =
normalizeUID(uidInput.value);


searchResult.innerHTML = "";


if(!enteredUID){

message.className =
"message error";

message.textContent =
"❌ Please enter Agent UID.";

return;

}


message.className =
"message info";

message.textContent =
"🔎 Searching...";


try{


/* =====================================
   GET ALL AGENTS
===================================== */

const {
data:agents,
error:agentError
} =
await supabaseClient

.from("agents")

.select(
"id,uid,name,mobile,status"
);


if(agentError){

console.error(
"Agent error:",
agentError
);

message.className =
"message error";

message.textContent =
"❌ Database error: " +
agentError.message;

return;

}


if(!agents){

message.className =
"message error";

message.textContent =
"❌ No agent data received.";

return;

}


/* =====================================
   FIND UID
===================================== */

const agent =
agents.find(
item =>
normalizeUID(item.uid) === enteredUID
);


if(!agent){

message.className =
"message error";

message.textContent =
"❌ Agent not found.";

console.log(
"Entered UID:",
enteredUID
);

console.log(
"Database agents:",
agents
);

return;

}


/* =====================================
   AGENT FOUND
===================================== */

message.className =
"message success";

message.textContent =
"✅ Agent found successfully.";


/* =====================================
   GET DEPOSITS
===================================== */

const {
data:deposits,
error:depositError
} =
await supabaseClient

.from("deposits")

.select("*")

.eq(
"agent_id",
agent.id
);


if(depositError){

console.error(
"Deposit error:",
depositError
);

message.className =
"message error";

message.textContent =
"❌ Deposit error: " +
depositError.message;

return;

}


/* =====================================
   GET WITHDRAWALS
===================================== */

const {
data:withdrawals,
error:withdrawalError
} =
await supabaseClient

.from("withdrawals")

.select("*")

.eq(
"agent_id",
agent.id
);


if(withdrawalError){

console.error(
"Withdrawal error:",
withdrawalError
);

message.className =
"message error";

message.textContent =
"❌ Withdrawal error: " +
withdrawalError.message;

return;

}


/* =====================================
   DEPOSIT TOTAL
===================================== */

let approvedDeposit =
0;

let totalDeposit =
0;


(deposits || []).forEach(
deposit => {

const amount =
Number(
deposit.amount || 0
);

totalDeposit += amount;


if(
String(
deposit.status || ""
).toLowerCase() ===
"approved"
){

approvedDeposit += amount;

}

});


/* =====================================
   COMMISSION 10%
===================================== */

const commission =
approvedDeposit * 0.10;


/* =====================================
   WITHDRAWAL TOTAL
===================================== */

let totalWithdrawal =
0;


(withdrawals || []).forEach(
withdrawal => {

const amount =
Number(
withdrawal.amount || 0
);

if(
String(
withdrawal.status || ""
).toLowerCase() ===
"approved"
){

totalWithdrawal += amount;

}

});


/* =====================================
   SHOW RESULT
===================================== */

let depositRows = "";


if(
!deposits ||
deposits.length === 0
){

depositRows = `

<tr>

<td colspan="4">
No deposits found
</td>

</tr>

`;

}else{

depositRows =
deposits.map(
deposit => {

const status =
String(
deposit.status || ""
).toLowerCase();

let statusClass =
"";

if(status === "approved"){
statusClass = "approved";
}

if(status === "pending"){
statusClass = "pending";
}

if(status === "rejected"){
statusClass = "rejected";
}

return `

<tr>

<td>
${deposit.id ?? "-"}
</td>

<td>
₹${Number(
deposit.amount || 0
).toFixed(2)}
</td>

<td class="${statusClass}">
${deposit.status || "-"}
</td>

<td>
₹${(
Number(deposit.amount || 0) * 0.10
).toFixed(2)}
</td>

</tr>

`;

}
).join("");

}


searchResult.innerHTML = `

<div class="agent-box">

<h3>
👤 Agent Details
</h3>


<div class="agent-row">

<span class="label">
ID
</span>

<span>
${agent.id}
</span>

</div>


<div class="agent-row">

<span class="label">
UID
</span>

<span class="uid">
${agent.uid}
</span>

</div>


<div class="agent-row">

<span class="label">
Name
</span>

<span>
${agent.name || "-"}
</span>

</div>


<div class="agent-row">

<span class="label">
Mobile
</span>

<span>
${agent.mobile || "-"}
</span>

</div>


<div class="agent-row">

<span class="label">
Status
</span>

<span>
${agent.status || "-"}
</span>

</div>


<div class="agent-row">

<span class="label">
Total Deposit
</span>

<span>
₹${totalDeposit.toFixed(2)}
</span>

</div>


<div class="agent-row">

<span class="label">
Approved Deposit
</span>

<span>
₹${approvedDeposit.toFixed(2)}
</span>

</div>


<div class="agent-row">

<span class="label">
Commission 10%
</span>

<span>
₹${commission.toFixed(2)}
</span>

</div>


<div class="agent-row">

<span class="label">
Approved Withdrawal
</span>

<span>
₹${totalWithdrawal.toFixed(2)}
</span>

</div>


</div>


<div class="card">

<h3>
💰 Deposit History
</h3>


<table>

<thead>

<tr>

<th>ID</th>

<th>Amount</th>

<th>Status</th>

<th>10% Commission</th>

</tr>

</thead>


<tbody>

${depositRows}

</tbody>

</table>


</div>

`;



}catch(error){

console.error(error);

message.className =
"message error";

message.textContent =
"❌ Error: " +
error.message;

}

}


/* =====================================
   ENTER KEY SEARCH
===================================== */

uidInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

searchAgent();

}

}
);


/* =====================================
   TOTALS
===================================== */

async function loadAdminTotals(){

try{


const {
data:agents,
error:agentsError
} =
await supabaseClient

.from("agents")

.select("id");


if(agentsError){

console.error(
agentsError
);

return;

}


document.getElementById(
"totalAgents"
).textContent =
agents.length;


const {
data:deposits,
error:depositError
} =
await supabaseClient

.from("deposits")

.select("amount");


if(!depositError){

let total = 0;

(deposits || []).forEach(
item => {

total += Number(
item.amount || 0
);

});

document.getElementById(
"totalDeposits"
).textContent =
"₹" + total.toFixed(2);

}


const {
data:withdrawals,
error:withdrawalError
} =
await supabaseClient

.from("withdrawals")

.select("amount");


if(!withdrawalError){

let total = 0;

(withdrawals || []).forEach(
item => {

total += Number(
item.amount || 0
);

});

document.getElementById(
"totalWithdrawals"
).textContent =
"₹" + total.toFixed(2);

}


}catch(error){

console.error(error);

}

}


/* =====================================
   PAGE LOAD
===================================== */

loadAdminTotals();


</script>


</body>

</html>
