<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sathi Pay - Reset UPI PIN</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#f7f2ff,#effcf8);
  color:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.card{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:26px;
  padding:28px 22px;
  box-shadow:0 22px 60px rgba(31,61,115,.16);
  border:1px solid #e5edff;
  position:relative;
  overflow:hidden
}
.card:before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:7px;
  background:linear-gradient(90deg,#087df5,#7548f5,#10b981)
}
.logo{
  width:76px;height:76px;
  margin:8px auto 14px;
  display:block
}
h1{
  text-align:center;
  margin:0 0 7px;
  font-size:28px
}
.sub{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin:0 0 24px
}
label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#334155;
  margin:15px 0 7px
}
input{
  width:100%;
  padding:15px;
  border:1px solid #d7dce5;
  border-radius:14px;
  font-size:18px;
  letter-spacing:5px;
  text-align:center;
  outline:none
}
input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.09)
}
button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:20px;
  background:linear-gradient(100deg,#087ff5,#5538f5,#11d994);
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
#message{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  font-size:13px;
  line-height:1.5
}
.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
  font-size:14px
}
</style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="assets/sathipay-logo.svg?v=13"
    alt="Sathi Pay"
  >

  <h1>Reset UPI PIN</h1>

  <p class="sub">
    Enter the 6-digit code sent to your registered email, then create a new UPI PIN.
  </p>

  <form id="pinForm">

    <div id="otpStep">

      <label for="otpCode">6-Digit Verification Code</label>

      <input
        id="otpCode"
        type="text"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        autocomplete="one-time-code"
        placeholder="••••••"
        required
      >

      <button type="button" id="verifyOtpBtn">
        Verify Code
      </button>

    </div>

    <div id="pinStep" style="display:none">

      <label for="newPin">New 6-Digit PIN</label>

      <input
        id="newPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        autocomplete="new-password"
        placeholder="••••••"
      >

      <label for="confirmPin">Confirm 6-Digit PIN</label>

      <input
        id="confirmPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        autocomplete="new-password"
        placeholder="••••••"
      >

      <button type="submit" id="savePin">
        Set New PIN
      </button>

    </div>

  </form>

  <div id="message"></div>

  <a class="back" href="link-upi.html">
    ← Back to Link UPI
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=8"></script>

<script>
const otpCode =
  document.getElementById('otpCode');

const verifyOtpBtn =
  document.getElementById('verifyOtpBtn');

const otpStep =
  document.getElementById('otpStep');

const pinStep =
  document.getElementById('pinStep');

const form =
  document.getElementById('pinForm');

const newPin =
  document.getElementById('newPin');

const confirmPin =
  document.getElementById('confirmPin');

const savePin =
  document.getElementById('savePin');

const message =
  document.getElementById('message');

function showMessage(text, color){
  message.style.color = color || '#dc2626';
  message.textContent = text;
}

function digitsOnly(input){
  input.value =
    input.value
      .replace(/\D/g, '')
      .slice(0, 6);
}

otpCode.addEventListener('input', () => {
  digitsOnly(otpCode);
});

[newPin, confirmPin].forEach(input => {
  input.addEventListener('input', () => {
    digitsOnly(input);
  });
});

verifyOtpBtn.addEventListener(
  'click',
  async () => {

    showMessage('', '#dc2626');

    const email =
      String(
        sessionStorage.getItem(
          'sathiPayUPIPinResetEmail'
        ) || ''
      )
      .trim()
      .toLowerCase();

    const token =
      otpCode.value.trim();

    if(!email){

      showMessage(
        'Reset session expired. Please click Forgot PIN again.',
        '#dc2626'
      );

      return;

    }

    if(!/^\d{6}$/.test(token)){

      showMessage(
        'Enter the 6-digit code from your email.',
        '#dc2626'
      );

      otpCode.focus();
      return;

    }

    verifyOtpBtn.disabled = true;
    verifyOtpBtn.textContent = 'Verifying...';

    const {
      data,
      error
    } =
      await supabaseClient.auth.verifyOtp({
        email: email,
        token: token,
        type: 'email'
      });

    if(
      error ||
      !data ||
      !data.session ||
      !data.user
    ){

      console.error(
        'UPI PIN OTP verify error:',
        error
      );

      verifyOtpBtn.disabled = false;
      verifyOtpBtn.textContent = 'Verify Code';

      showMessage(
        'Invalid or expired code. Please enter the latest 6-digit code.',
        '#dc2626'
      );

      return;

    }

    otpStep.style.display = 'none';
    pinStep.style.display = 'block';

    otpCode.required = false;
    newPin.required = true;
    confirmPin.required = true;

    verifyOtpBtn.disabled = false;
    verifyOtpBtn.textContent = 'Verify Code';

    showMessage(
      '✅ Code verified. Now create your new 6-digit UPI PIN.',
      '#15803d'
    );

    newPin.focus();

  }
);

form.addEventListener(
  'submit',
  async event => {

    event.preventDefault();

    if(pinStep.style.display === 'none'){

      return;

    }

    showMessage('', '#dc2626');

    const pin =
      newPin.value.trim();

    const confirm =
      confirmPin.value.trim();

    if(!/^\d{6}$/.test(pin)){

      showMessage(
        'PIN must be exactly 6 digits.',
        '#dc2626'
      );

      newPin.focus();
      return;

    }

    if(pin !== confirm){

      showMessage(
        'PINs do not match.',
        '#dc2626'
      );

      confirmPin.focus();
      return;

    }

    savePin.disabled = true;
    savePin.textContent = 'Saving...';

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        'reset_customer_upi_pin',
        {
          p_pin: pin
        }
      );

    if(
      error ||
      data !== true
    ){

      console.error(
        'UPI PIN reset error:',
        error
      );

      savePin.disabled = false;
      savePin.textContent = 'Set New PIN';

      showMessage(
        'Unable to reset PIN. Please try again.',
        '#dc2626'
      );

      return;

    }

    sessionStorage.removeItem(
      'sathiPayUPIPinResetEmail'
    );

    showMessage(
      '✅ UPI PIN updated successfully.',
      '#15803d'
    );

    savePin.textContent = 'PIN Updated';

    setTimeout(
      () => {
        window.location.href =
          'link-upi.html';
      },
      900
    );

  }
);

const resetEmail =
  sessionStorage.getItem(
    'sathiPayUPIPinResetEmail'
  );

if(!resetEmail){

  showMessage(
    'Please return to Link UPI and click Forgot PIN to receive a new code.',
    '#dc2626'
  );

  verifyOtpBtn.disabled = true;

}
</script>

</body>
</html>
