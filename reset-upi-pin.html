<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sathi Pay - Reset UPI PIN</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#f7f2ff,#effcf8);
  color:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.card{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:26px;
  padding:28px 22px;
  box-shadow:0 22px 60px rgba(31,61,115,.16);
  border:1px solid #e5edff;
  position:relative;
  overflow:hidden
}
.card:before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:7px;
  background:linear-gradient(90deg,#087df5,#7548f5,#10b981)
}
.logo{
  width:76px;height:76px;
  margin:8px auto 14px;
  display:block
}
h1{
  text-align:center;
  margin:0 0 7px;
  font-size:28px
}
.sub{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin:0 0 24px
}
label{
  display:block;
  font-size:13px;
  font-weight:800;
  color:#334155;
  margin:15px 0 7px
}
input{
  width:100%;
  padding:15px;
  border:1px solid #d7dce5;
  border-radius:14px;
  font-size:18px;
  letter-spacing:5px;
  text-align:center;
  outline:none
}
input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.09)
}
button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:20px;
  background:linear-gradient(100deg,#087ff5,#5538f5,#11d994);
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
#message{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  font-size:13px;
  line-height:1.5
}
.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
  font-size:14px
}
</style>
</head>

<body>

<div class="card">

  <img
    class="logo"
    src="assets/sathipay-logo.svg?v=13"
    alt="Sathi Pay"
  >

  <h1>Reset UPI PIN</h1>

  <p class="sub">
    Enter the 6-digit code sent to your registered email, then create a new UPI PIN.
  </p>

  <form id="pinForm">

    <div id="otpStep">

      <label for="otpCode">6-Digit Verification Code</label>

      <input
        id="otpCode"
        type="text"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        autocomplete="one-time-code"
        placeholder="••••••"
        required
      >

      <button type="button" id="verifyOtpBtn">
        Verify Code
      </button>

    </div>

    <div id="pinStep" style="display:none">

      <label for="newPin">New 6-Digit PIN</label>

      <input
        id="newPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        autocomplete="new-password"
        placeholder="••••••"
      >

      <label for="confirmPin">Confirm 6-Digit PIN</label>

      <input
        id="confirmPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        autocomplete="new-password"
        placeholder="••••••"
      >

      <button type="submit" id="savePin">
        Set New PIN
      </button>

    </div>

  </form>

  <div id="message"></div>

  <a class="back" href="link-upi.html">
    ← Back to Link UPI
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=8"></script>

<script>
const newPin = document.getElementById('newPin');
const confirmPin = document.getElementById('confirmPin');
const savePin = document.getElementById('savePin');
const message = document.getElementById('message');

function showMessage(text, color){
  message.style.color = color || '#dc2626';
  message.textContent = text;
}

function digitsOnly(input){
  input.value = input.value.replace(/\\D/g, '').slice(0, 6);
}

[newPin, confirmPin].forEach(input => {
  input.addEventListener('input', () => digitsOnly(input));
});

async function ensureRecoverySession(){
  const { data, error } =
    await supabaseClient.auth.getSession();

  if(
    error ||
    !data ||
    !data.session ||
    !data.session.user
  ){
    showMessage(
      'This UPI PIN reset link is expired or invalid. Please click Forgot PIN again.',
      '#dc2626'
    );
    savePin.disabled = true;
    return false;
  }

  return true;
}

/*
 * This page is only for UPI PIN recovery.
 * It uses the authenticated recovery session to authorize
 * the UPI PIN RPC; it does not change the customer's login password.
 */
(async function(){
  const ready = await ensureRecoverySession();

  if(!ready){
    return;
  }

  showMessage(
    'Enter your new 6-digit UPI PIN below.',
    '#2563eb'
  );

  newPin.focus();
})();

document.getElementById('pinForm').addEventListener(
  'submit',
  async event => {
    event.preventDefault();

    const ready = await ensureRecoverySession();
    if(!ready){
      return;
    }

    const pin = newPin.value.trim();
    const confirm = confirmPin.value.trim();

    if(!/^\\d{6}$/.test(pin)){
      showMessage(
        'UPI PIN must be exactly 6 digits.',
        '#dc2626'
      );
      newPin.focus();
      return;
    }

    if(pin !== confirm){
      showMessage(
        'UPI PINs do not match.',
        '#dc2626'
      );
      confirmPin.focus();
      return;
    }

    savePin.disabled = true;
    savePin.textContent = 'Updating...';
    showMessage(
      'Updating your UPI PIN...',
      '#2563eb'
    );

    try{
      const { data, error } =
        await supabaseClient.rpc(
          'reset_customer_upi_pin',
          { p_pin: pin }
        );

      if(error || data !== true){
        console.error(
          'UPI PIN reset error:',
          error
        );

        savePin.disabled = false;
        savePin.textContent = 'Set New PIN';
        showMessage(
          'Unable to reset PIN. Please try again.',
          '#dc2626'
        );
        return;
      }

      showMessage(
        '✅ UPI PIN updated successfully.',
        '#15803d'
      );
      savePin.textContent = 'PIN Updated';

      await supabaseClient.auth.signOut();

      setTimeout(() => {
        window.location.href = 'customer-login.html';
      }, 1200);

    }
    catch(error){
      console.error(
        'UPI PIN reset exception:',
        error
      );

      savePin.disabled = false;
      savePin.textContent = 'Set New PIN';
      showMessage(
        'Something went wrong. Please try again.',
        '#dc2626'
      );
    }
  }
);
</script>

</body>
</html>
