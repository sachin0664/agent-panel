<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sathi Pay - Withdrawal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #202938;
}

header {
    background: #202938;
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.admin {
    color: white;
    font-weight: bold;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
    color: #2563eb;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.info {
    background: #eff6ff;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    line-height: 1.7;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #dc2626;
    color: white;
    font-size: 17px;
    font-weight: bold;
    margin-top: 20px;
}

button:disabled {
    background: #94a3b8;
}

.success {
    color: #16a34a;
    font-weight: bold;
    margin-top: 15px;
}

.error {
    color: #dc2626;
    font-weight: bold;
    margin-top: 15px;
}

.loading {
    color: #2563eb;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    border-bottom: 1px solid #e2e8f0;
    padding: 10px 5px;
    text-align: left;
    font-size: 14px;
}

th {
    color: #475569;
}

.approve {
    background: #16a34a;
    margin: 0;
    padding: 8px;
    font-size: 13px;
}

.reject {
    background: #dc2626;
    margin: 5px 0 0;
    padding: 8px;
    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        padding: 12px;
    }

    .card {
        padding: 15px;
    }

    table {
        font-size: 12px;
    }

}

</style>

</head>

<body>

<header>

    <h1>Sathi Pay - Withdrawal</h1>

    <div class="admin">
        Admin
    </div>

</header>


<div class="container">


    <!-- NEW WITHDRAWAL -->

    <div class="card">

        <h2>💸 New Withdrawal</h2>


        <label for="agentSelect">
            Select Agent
        </label>


        <select id="agentSelect">

            <option value="">
                Loading agents...
            </option>

        </select>


        <div
            id="agentInfo"
            class="info"
            style="display:none;">

        </div>


        <label for="amount">
            Amount (₹)
        </label>


        <input
            type="number"
            id="amount"
            min="110"
            max="50000"
            placeholder="Enter amount">


        <div class="info">

            Minimum withdrawal:
            <b>₹110</b>

            <br>

            Maximum withdrawal:
            <b>₹50,000</b>

        </div>


        <button
            id="submitBtn"
            disabled>

            Submit Withdrawal

        </button>


        <div id="message"></div>

    </div>



    <!-- WITHDRAWAL HISTORY -->

    <div class="card">

        <h2>📜 Withdrawal History</h2>

        <div
            id="historyMessage"
            class="loading">

            Loading withdrawal history...

        </div>


        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Agent</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="historyBody">

                </tbody>

            </table>

        </div>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const agentSelect =
    document.getElementById(
        "agentSelect"
    );

const agentInfo =
    document.getElementById(
        "agentInfo"
    );

const amountInput =
    document.getElementById(
        "amount"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const historyBody =
    document.getElementById(
        "historyBody"
    );

const historyMessage =
    document.getElementById(
        "historyMessage"
    );


let agents = [];


/* =========================================
   LOAD AGENTS
========================================= */

async function loadAgents() {

    agentSelect.innerHTML =
        '<option value="">Loading agents...</option>';

    submitBtn.disabled = true;


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("agents")
            .select(`
                id,
                uid,
                name,
                mobile,
                status,
                wallet_balance
            `)
            .order(
                "id",
                {
                    ascending: true
                }
            );


        console.log(
            "AGENTS:",
            data
        );


        if (error) {

            console.error(
                "Agent loading error:",
                error
            );

            agentSelect.innerHTML =
                '<option value="">Unable to load agents</option>';

            message.textContent =
                "Agent loading error: " +
                error.message;

            message.className =
                "error";

            return;

        }


        agents =
            data || [];


        if (
            agents.length === 0
        ) {

            agentSelect.innerHTML =
                '<option value="">No agents found</option>';

            message.textContent =
                "No agents found.";

            message.className =
                "error";

            return;

        }


        agentSelect.innerHTML =
            '<option value="">Select Agent</option>';


        agents.forEach(
            function(agent) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    agent.id;


                option.textContent =
                    (
                        agent.uid ||
                        "NO UID"
                    ) +
                    " - " +
                    (
                        agent.name ||
                        "Unknown"
                    );


                agentSelect.appendChild(
                    option
                );

            }
        );


        console.log(
            "Agents loaded successfully:",
            agents.length
        );

    } catch (error) {

        console.error(
            "LOAD AGENTS ERROR:",
            error
        );


        agentSelect.innerHTML =
            '<option value="">Agent loading failed</option>';


        message.textContent =
            "Agent loading failed.";

        message.className =
            "error";

    }

}


/* =========================================
   AGENT SELECT
========================================= */

agentSelect.addEventListener(
    "change",
    function() {

        const selectedId =
            Number(
                agentSelect.value
            );


        const agent =
            agents.find(
                function(item) {

                    return (
                        Number(item.id) ===
                        selectedId
                    );

                }
            );


        if (!agent) {

            agentInfo.style.display =
                "none";

            submitBtn.disabled =
                true;

            return;

        }


        const wallet =
            Number(
                agent.wallet_balance || 0
            );


        agentInfo.style.display =
            "block";


        agentInfo.innerHTML =

            "<b>UID:</b> " +
            (
                agent.uid || "-"
            ) +

            "<br>" +

            "<b>Agent:</b> " +
            (
                agent.name || "-"
            ) +

            "<br>" +

            "<b>Mobile:</b> " +
            (
                agent.mobile || "-"
            ) +

            "<br>" +

            "<b>Wallet Balance:</b> ₹" +
            wallet.toFixed(2);


        checkAmount();

    }
);


/* =========================================
   CHECK AMOUNT
========================================= */

amountInput.addEventListener(
    "input",
    checkAmount
);


function checkAmount() {

    const selectedId =
        Number(
            agentSelect.value
        );


    const amount =
        Number(
            amountInput.value
        );


    const agent =
        agents.find(
            function(item) {

                return (
                    Number(item.id) ===
                    selectedId
                );

            }
        );


    if (!agent) {

        submitBtn.disabled =
            true;

        return;

    }


    const wallet =
        Number(
            agent.wallet_balance || 0
        );


    if (
        amount >= 110 &&
        amount <= 50000 &&
        amount <= wallet
    ) {

        submitBtn.disabled =
            false;

    } else {

        submitBtn.disabled =
            true;

    }

}


/* =========================================
   SUBMIT WITHDRAWAL
========================================= */

submitBtn.addEventListener(
    "click",
    async function() {

        message.textContent =
            "";

        message.className =
            "";


        const agentId =
            Number(
                agentSelect.value
            );


        const amount =
            Number(
                amountInput.value
            );


        const agent =
            agents.find(
                function(item) {

                    return (
                        Number(item.id) ===
                        agentId
                    );

                }
            );


        if (!agent) {

            message.textContent =
                "Please select an agent.";

            message.className =
                "error";

            return;

        }


        const wallet =
            Number(
                agent.wallet_balance || 0
            );


        if (
            amount < 110
        ) {

            message.textContent =
                "Minimum withdrawal is ₹110.";

            message.className =
                "error";

            return;

        }


        if (
            amount > 50000
        ) {

            message.textContent =
                "Maximum withdrawal is ₹50,000.";

            message.className =
                "error";

            return;

        }


        if (
            amount > wallet
        ) {

            message.textContent =
                "Insufficient wallet balance. Available: ₹" +
                wallet.toFixed(2);

            message.className =
                "error";

            return;

        }


        submitBtn.disabled =
            true;


        submitBtn.textContent =
            "Submitting...";


        const {
            error
        } =
            await supabaseClient
            .from("withdrawals")
            .insert([
                {
                    agent_id: agentId,
                    amount: amount,
                    status: "Pending"
                }
            ]);


        if (error) {

            console.error(
                "Withdrawal insert error:",
                error
            );


            message.textContent =
                "Withdrawal error: " +
                error.message;

            message.className =
                "error";


            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Submit Withdrawal";

            return;

        }


        message.textContent =
            "Withdrawal submitted successfully.";

        message.className =
            "success";


        amountInput.value =
            "";


        submitBtn.textContent =
            "Submit Withdrawal";


        await loadAgents();

        await loadHistory();

    }
);


/* =========================================
   LOAD HISTORY
========================================= */

async function loadHistory() {

    historyMessage.textContent =
        "Loading withdrawal history...";

    historyMessage.className =
        "loading";


    historyBody.innerHTML =
        "";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("withdrawals")
        .select(`
            id,
            agent_id,
            amount,
            status,
            created_at,
            agents (
                uid,
                name,
                mobile
            )
        `)
        .order(
            "id",
            {
                ascending: false
            }
        );


    console.log(
        "WITHDRAWAL HISTORY:",
        data
    );


    if (error) {

        console.error(
            "History error:",
            error
        );


        historyMessage.textContent =
            "History loading error: " +
            error.message;

        historyMessage.className =
            "error";

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        historyMessage.textContent =
            "No withdrawals found.";

        historyMessage.className =
            "";

        return;

    }


    historyMessage.textContent =
        "";


    data.forEach(
        function(row) {

            const tr =
                document.createElement(
                    "tr"
                );


            const agent =
                row.agents || {};


            const status =
                String(
                    row.status || ""
                )
                .toLowerCase()
                .trim();


            let actionHTML =
                "-";


            if (
                status === "pending"
            ) {

                actionHTML =

                    '<button class="approve" ' +
                    'onclick="approveWithdrawal(' +
                    row.id +
                    ')">' +
                    'Approve' +
                    '</button>' +

                    '<button class="reject" ' +
                    'onclick="rejectWithdrawal(' +
                    row.id +
                    ')">' +
                    'Reject' +
                    '</button>';

            }


            tr.innerHTML =

                "<td>" +
                row.id +
                "</td>" +

                "<td>" +
                (
                    agent.uid ||
                    agent.name ||
                    row.agent_id
                ) +
                "</td>" +

                "<td>₹" +
                Number(
                    row.amount || 0
                ).toFixed(2) +
                "</td>" +

                "<td>" +
                (
                    row.status ||
                    "-"
                ) +
                "</td>" +

                "<td>" +
                actionHTML +
                "</td>";


            historyBody.appendChild(
                tr
            );

        }
    );

}


/* =========================================
   APPROVE WITHDRAWAL
========================================= */

async function approveWithdrawal(
    withdrawalId
) {

    const confirmApprove =
        confirm(
            "Approve this withdrawal?"
        );


    if (!confirmApprove) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
        .rpc(
            "approve_withdrawal",
            {
                p_withdrawal_id:
                    withdrawalId
            }
        );


    console.log(
        "Approve result:",
        data,
        error
    );


    if (error) {

        alert(
            "Approval error: " +
            error.message
        );

        return;

    }


    alert(
        data ||
        "Withdrawal approved."
    );


    await loadAgents();

    await loadHistory();

}


/* =========================================
   REJECT WITHDRAWAL
========================================= */

async function rejectWithdrawal(
    withdrawalId
) {

    const confirmReject =
        confirm(
            "Reject this withdrawal?"
        );


    if (!confirmReject) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
        .from("withdrawals")
        .update({
            status: "Rejected"
        })
        .eq(
            "id",
            withdrawalId
        );


    if (error) {

        alert(
            "Reject error: " +
            error.message
        );

        return;

    }


    alert(
        "Withdrawal rejected."
    );


    await loadHistory();

}


/* =========================================
   PAGE READY
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        console.log(
            "SATHI PAY WITHDRAWAL READY"
        );


        await loadAgents();

        await loadHistory();

    }
);

</script>

</body>

    </html>
