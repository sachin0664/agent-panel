<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sathi Pay Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:20px;
    padding:30px 24px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.header{
    text-align:center;
    margin-bottom:28px;
}

.shield{
    font-size:55px;
}

h1{
    margin:8px 0;
    font-size:30px;
    color:#172033;
}

.subtitle{
    color:#6b7280;
    font-size:16px;
}

label{
    display:block;
    margin:18px 0 8px;
    font-weight:bold;
    color:#374151;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    margin-top:24px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.forgot-btn{
    display:block;
    width:auto;
    margin:16px auto 0;
    padding:0;
    background:none;
    color:#2563eb;
    font-size:14px;
    font-weight:bold;
}

.forgot-btn:hover{
    text-decoration:underline;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#2563eb;
    text-decoration:none;
}

.back:hover{
    text-decoration:underline;
}

.message{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
    font-size:14px;
}

.success{
    color:#16a34a;
}

.error{
    color:#dc2626;
}

.hidden{
    display:none;
}

.divider{
    margin:22px 0;
    border-top:1px solid #e5e7eb;
}

.forgot-box{
    margin-top:20px;
    padding:18px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:15px;
}

.forgot-title{
    font-size:17px;
    font-weight:bold;
    color:#172033;
    margin-bottom:7px;
}

.forgot-text{
    color:#64748b;
    font-size:12px;
    line-height:1.5;
    margin-bottom:12px;
}

.cancel-btn{
    background:#64748b;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

    <div class="header">

        <div class="shield">
            🛡️
        </div>

        <h1>
            Sathi Pay Admin
        </h1>

        <div class="subtitle">
            Secure Admin Login
        </div>

    </div>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <form id="adminLoginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginBtn">

            🔐 Admin Login

        </button>

    </form>


    <!-- FORGOT PASSWORD BUTTON -->

    <button
        type="button"
        class="forgot-btn"
        id="showForgotBtn">

        Forgot Password?

    </button>


    <!-- =========================
         FORGOT PASSWORD
    ========================== -->

    <div
        id="forgotBox"
        class="forgot-box hidden">

        <div class="forgot-title">
            🔑 Reset Admin Password
        </div>

        <div class="forgot-text">
            Enter your admin email. If the account is eligible,
            Supabase will send a password reset link to that email.
        </div>


        <form id="forgotForm">

            <label for="resetEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Enter admin email"
                autocomplete="email"
                required
            >


            <button
                type="submit"
                id="resetBtn">

                📧 Send Reset Link

            </button>


            <button
                type="button"
                class="cancel-btn"
                id="cancelForgotBtn">

                Cancel

            </button>

        </form>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <a
        class="back"
        href="index.html">

        ← Back to Customer Login

    </a>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
    "https://lozluohksmjxbxixkbmq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_R6LUj2dUcEwVL5Xuce-7Wg_8y4ZpnBm";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById(
        "adminLoginForm"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const showForgotBtn =
    document.getElementById(
        "showForgotBtn"
    );

const forgotBox =
    document.getElementById(
        "forgotBox"
    );

const forgotForm =
    document.getElementById(
        "forgotForm"
    );

const resetBtn =
    document.getElementById(
        "resetBtn"
    );

const cancelForgotBtn =
    document.getElementById(
        "cancelForgotBtn"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const resetEmail =
    document.getElementById(
        "resetEmail"
    );


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " +
        (
            type === "success"
            ? "success"
            : "error"
        );

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth.getUser();


        if(error || !data || !data.user){

            return false;

        }


        const {
            data: isAdmin,
            error: adminError
        } =
            await supabaseClient.rpc(
                "is_admin"
            );


        if(
            adminError ||
            isAdmin !== true
        ){

            await supabaseClient.auth.signOut();

            return false;

        }


        return true;


    }catch(error){

        console.error(
            "Admin check error:",
            error
        );

        return false;

    }

}


/* =========================
   EXISTING SESSION CHECK
========================= */

async function checkExistingSession(){

    const isAdmin =
        await checkAdmin();


    if(isAdmin){

        showMessage(
            "✅ You are already logged in. Opening admin panel...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "admin.html";

            },
            500
        );

    }

}


/* =========================
   ADMIN LOGIN
========================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;


        showMessage(
            "",
            "success"
        );

        message.textContent = "";


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        try{

            /* LOGIN */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({
                    email:email,
                    password:password
                });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "Login session was not created."
                );

            }


            /* ADMIN PERMISSION CHECK */

            const {
                data: isAdmin,
                error: adminError
            } =
                await supabaseClient.rpc(
                    "is_admin"
                );


            if(adminError){

                await supabaseClient.auth.signOut();

                throw adminError;

            }


            if(isAdmin !== true){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "This account is not registered as an admin."
                );

            }


            showMessage(
                "✅ Admin login successful. Opening dashboard...",
                "success"
            );


            loginBtn.textContent =
                "✅ Login Successful";


            setTimeout(
                function(){

                    window.location.href =
                        "admin.html";

                },
                700
            );


        }catch(error){

            console.error(
                "Admin login error:",
                error
            );


            showMessage(
                "❌ " +
                (
                    error.message ||
                    "Admin login failed."
                ),
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "🔐 Admin Login";

        }

    }
);


/* =========================
   SHOW FORGOT PASSWORD
========================= */

showForgotBtn.addEventListener(
    "click",
    function(){

        forgotBox.classList.remove(
            "hidden"
        );

        showForgotBtn.classList.add(
            "hidden"
        );


        if(emailInput.value.trim()){

            resetEmail.value =
                emailInput.value.trim();

        }


        resetEmail.focus();

    }
);


/* =========================
   CANCEL FORGOT PASSWORD
========================= */

cancelForgotBtn.addEventListener(
    "click",
    function(){

        forgotBox.classList.add(
            "hidden"
        );

        showForgotBtn.classList.remove(
            "hidden"
        );

        message.textContent = "";

        message.className =
            "message";

    }
);


/* =========================
   SEND PASSWORD RESET
========================= */

forgotForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            resetEmail.value.trim();


        if(!email){

            showMessage(
                "❌ Please enter your admin email.",
                "error"
            );

            return;

        }


        resetBtn.disabled =
            true;

        resetBtn.textContent =
            "Sending...";


        message.textContent = "";

        message.className =
            "message";


        try{

            /*
             * This automatically creates the
             * correct GitHub Pages URL:
             *
             * /agent-panel/admin-reset-password.html
             */

            const resetUrl =
                new URL(
                    "admin-reset-password.html",
                    window.location.href
                ).href;


            const {
                error
            } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            resetUrl
                    }
                );


            if(error){

                throw error;

            }


            /*
             * Do not reveal whether an email
             * exists in Supabase Auth.
             */

            showMessage(
                "✅ If this email is registered, a password reset link has been sent. Please check your email inbox and spam folder.",
                "success"
            );


            resetBtn.textContent =
                "📧 Reset Link Sent";


            setTimeout(
                function(){

                    resetBtn.disabled =
                        false;

                    resetBtn.textContent =
                        "📧 Send Reset Link";

                },
                4000
            );


        }catch(error){

            console.error(
                "Password reset error:",
                error
            );


            showMessage(
                "❌ Unable to send password reset email. Please try again.",
                "error"
            );


            resetBtn.disabled =
                false;

            resetBtn.textContent =
                "📧 Send Reset Link";

        }

    }
);


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
    async function(
        event,
        session
    ){

        if(
            event === "SIGNED_IN" &&
            session
        ){

            const isAdmin =
                await checkAdmin();


            if(isAdmin){

                window.location.href =
                    "admin.html";

            }

        }

    }
);


/* =========================
   INITIAL CHECK
========================= */

checkExistingSession();

</script>

</body>
            </html>
