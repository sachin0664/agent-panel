<title id="title">Sathi Pay SP Logo</title>
<desc id="desc">A distinctive colorful intertwined S and P monogram for Sathi Pay.</desc>
<defs>
<linearGradient id="bg" x1="55" y1="40" x2="455" y2="470" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#087FF5"/><stop offset=".45" stop-color="#4238F5"/><stop offset="1" stop-color="#10C98A"/>
</linearGradient>
<linearGradient id="ribbon" x1="120" y1="130" x2="410" y2="390" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E9FFFF"/><stop offset="1" stop-color="#5CF0C5"/>
</linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#062D72" flood-opacity=".28"/></filter>
