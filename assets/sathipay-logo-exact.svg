<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Sathi Pay SP</title>
<desc id="desc">Original colorful geometric Sathi Pay monogram with separated S and P.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/>
    <stop offset=".48" stop-color="#06B6D4"/>
    <stop offset="1" stop-color="#22C55E"/>
  </linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF4D8D"/>
    <stop offset="1" stop-color="#FFB000"/>
  </linearGradient>
  <linearGradient id="p" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#B9FFF5"/>
  </linearGradient>
</defs>
<rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bg)"/>
<!-- S: custom two-arc monogram -->
<path d="M246 139C226 119 199 108 166 108C119 108 88 134 88 174C88 215 118 235 165 249L202 260C228 268 241 282 241 301C241 324 218 340 187 340C153 340 124 326 101 302"
 fill="none" stroke="url(#s)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
<!-- P: separated, compact custom stem + bowl -->
<path d="M307 372V140H360C405 140 431 164 431 205C431 246 405 270 360 270H307"
 fill="none" stroke="url(#p)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
<!-- clean brand notch -->
<path d="M307 270H348" fill="none" stroke="#4F46E5" stroke-width="11" stroke-linecap="round"/>
</svg>