<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="55" y1="35" x2="465" y2="485" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1168ff"/>
      <stop offset="0.48" stop-color="#1552e8"/>
      <stop offset="1" stop-color="#20c997"/>
    </linearGradient>
    <linearGradient id="s" x1="120" y1="130" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d83ff"/>
      <stop offset="0.55" stop-color="#096fe9"/>
      <stop offset="1" stop-color="#12d18e"/>
    </linearGradient>
    <linearGradient id="p" x1="260" y1="150" x2="390" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2af3ae"/>
      <stop offset="1" stop-color="#10c985"/>
    </linearGradient>
    <linearGradient id="crown" x1="180" y1="70" x2="340" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe33e"/>
      <stop offset="1" stop-color="#f2b800"/>
    </linearGradient>
  </defs>

  <!-- Same Sathi Pay app mark: blue/green rounded square, crown, SP and white sweep. -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#bg)"/>

  <!-- Crown -->
  <path d="M155 145 L171 73 L222 111 L256 55 L290 111 L341 73 L357 145 Z"
        fill="url(#crown)" stroke="#e5ad00" stroke-width="5" stroke-linejoin="round"/>
  <path d="M157 143 H355 L342 169 H170 Z" fill="#ffd12f"/>
  <circle cx="171" cy="73" r="9" fill="#fff2a0"/>
  <circle cx="256" cy="55" r="9" fill="#fff2a0"/>
  <circle cx="341" cy="73" r="9" fill="#fff2a0"/>

  <!-- SP mark -->
  <text x="256" y="350" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="242" font-weight="900"
        letter-spacing="-32" fill="url(#s)">S</text>
  <text x="285" y="350" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="242" font-weight="900"
        letter-spacing="-20" fill="url(#p)">P</text>

  <!-- White signature sweep -->
  <path d="M105 342 C170 390 271 391 396 258"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

  <!-- Small brand text, as in the supplied app icon -->
  <text x="256" y="431" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800"
        letter-spacing="-1">
    <tspan fill="#087cf0">Sathi</tspan><tspan fill="#16dc98">Pay</tspan>
  </text>
</svg>