name: Build Ruvi Pay APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the new Ruvi Pay website URL
        env:
          RUVI_PAY_WEB_APP_URL: ${{ secrets.RUVI_PAY_WEB_APP_URL }}
        run: |
          if [ -z "$RUVI_PAY_WEB_APP_URL" ]; then
            echo "Set the RUVI_PAY_WEB_APP_URL repository secret after the new domain is connected."
            exit 1
          fi
          echo "WEB_APP_URL=$RUVI_PAY_WEB_APP_URL" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Ruvi Pay app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p sathi-pay-app/app/src/main/res/drawable
          rsvg-convert -w 512 -h 512 assets/sathipay-app-icon.svg > sathi-pay-app/app/src/main/res/drawable/sathipay_logo.png
          identify sathi-pay-app/app/src/main/res/drawable/sathipay_logo.png

      - name: Build Ruvi Pay APK
        working-directory: sathi-pay-app
        run: gradle assembleRelease --no-daemon -PwebAppUrl="$WEB_APP_URL"

      - name: Prepare APK
        run: cp sathi-pay-app/app/build/outputs/apk/release/app-release.apk RuviPay.apk

      - name: Publish Ruvi Pay release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ruvi-pay-v1.2.0-${{ github.run_number }}
          name: Ruvi Pay Android App v1.2.0-${{ github.run_number }}
          body: |
            Ruvi Pay Android application.
            Built with the configured Ruvi Pay website domain.
          files: RuviPay.apk
          make_latest: true
