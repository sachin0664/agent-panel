name: Build Sathi Pay APK
# Branding build: use the same crowned SP logo as the website/customer pages.

on:
  push:
    paths:
      - 'sathi-pay-app/**'
      - 'customer-register.html'
      - 'assets/sathipay-logo-user.jpg'
      - 'assets/sathipay-logo-final.jpg'
      - 'assets/sathipay-logo-exact.svg'
      - 'assets/sathipay-logo.svg'
      - 'assets/sathipay-app-icon.svg'
      - '.github/workflows/build-sathi-pay-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate the exact Sathi Pay SP logo for Android app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p sathi-pay-app/app/src/main/res/drawable
          rsvg-convert -w 512 -h 512 assets/sathipay-app-icon.svg > sathi-pay-app/app/src/main/res/drawable/sathipay_logo.png
          identify sathi-pay-app/app/src/main/res/drawable/sathipay_logo.png

      - name: Set up Gradle build
        working-directory: sathi-pay-app
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp sathi-pay-app/app/build/outputs/apk/release/app-release.apk SathiPay.apk

      - name: Publish APK on mysathipay.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          API="repos/${{ github.repository }}/contents/SathiPay.apk"
          RESPONSE=$(gh api "$API" 2>/dev/null || true)
          SHA=$(printf '%s' "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)

          python -c 'import base64,json,sys; p={"message":"Update customer APK" if sys.argv[1] else "Add customer APK","content":base64.b64encode(open("SathiPay.apk","rb").read()).decode("ascii"),"branch":"main"}; p.update({"sha":sys.argv[1]} if sys.argv[1] else {}); json.dump(p,open("apk-payload.json","w"))' "$SHA"
          gh api --method PUT "$API" --input apk-payload.json

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sathi-pay-v1.0.1-${{ github.run_number }}
          name: Sathi Pay Android App v1.0.1-${{ github.run_number }}
          body: |
            Sathi Pay Android application.
            The app opens the live Sathi Pay website at https://mysathipay.com/
          files: SathiPay.apk
          make_latest: true
