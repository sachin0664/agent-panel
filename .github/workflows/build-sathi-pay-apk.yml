name: Build Sathi Pay APK

on:
  push:
    paths:
      - 'sathi-pay-app/**'
      - '.github/workflows/build-sathi-pay-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        working-directory: sathi-pay-app
        run: gradle assembleRelease --no-daemon
      - name: Prepare APK
        run: cp sathi-pay-app/app/build/outputs/apk/release/app-release.apk SathiPay.apk
      - name: Publish APK on mysathipay.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CONTENT=$(base64 -w 0 SathiPay.apk)
          RESPONSE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/contents/SathiPay.apk)
          SHA=$(printf '%s' "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          if [ -n "$SHA" ]; then
            curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/contents/SathiPay.apk -d "{"message":"Update customer APK","content":"$CONTENT","sha":"$SHA","branch":"main"}"
          else
            curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/contents/SathiPay.apk -d "{"message":"Add customer APK","content":"$CONTENT","branch":"main"}"
          fi

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sathi-pay-v1.0.1-${{ github.run_number }}
          name: Sathi Pay Android App v1.0.1-${{ github.run_number }}
          body: |
            Sathi Pay Android application.
            The app opens the live Sathi Pay website at https://mysathipay.com/
          files: SathiPay.apk
          make_latest: true
