name: Build Ruvi Pay APK
# Branding build: use the same crowned SP logo as the website/customer pages.

on:
  push:
    paths:
      - 'sathi-pay-app/**'
      - 'customer-register.html'
      - 'assets/sathipay-logo-user.jpg'
      - 'assets/sathipay-logo-final.jpg'
      - 'assets/sathipay-logo-exact.svg'
      - 'assets/sathipay-logo.svg'
      - 'assets/sathipay-app-icon.svg'
      - '.github/workflows/build-sathi-pay-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate the exact Ruvi Pay SP logo for Android app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p sathi-pay-app/app/src/main/res/drawable
          rsvg-convert -w 512 -h 512 assets/sathipay-app-icon.svg > sathi-pay-app/app/src/main/res/drawable/sathipay_logo.png
          identify sathi-pay-app/app/src/main/res/drawable/sathipay_logo.png

      - name: Set up Gradle build
        working-directory: sathi-pay-app
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp sathi-pay-app/app/build/outputs/apk/release/app-release.apk RuviPay.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ruvi-pay-v1.1.0-${{ github.run_number }}
          name: Ruvi Pay Android App v1.1.0-${{ github.run_number }}
          body: |
            Ruvi Pay Android application.
            The app website URL is configured at build time using the webAppUrl Gradle property. Build the customer APK only after the new Ruvi Pay domain is connected.
          files: RuviPay.apk
          make_latest: true
