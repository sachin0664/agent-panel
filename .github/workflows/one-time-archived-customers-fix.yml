name: One-time archived customers UI fix

on:
  push:
    paths:
      - ".github/workflows/one-time-archived-customers-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix archived customers initial state
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("admin.html")
          text = path.read_text(encoding="utf-8")

          pattern = r'(async function loadArchivedCustomers\(\)\{\n\n    const box = document\.getElementById\("archivedCustomerList"\);\n)    box\.classList\.add\("open"\);\n'
          new_text, count = re.subn(pattern, r'\1', text, count=1)

          if count != 1:
              raise SystemExit("Expected archived-customer auto-open line was not found exactly once.")

          path.write_text(new_text, encoding="utf-8")

      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Fix deleted customers initial collapsed state"
          git push

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-archived-customers-fix.yml
          git add .github/workflows/one-time-archived-customers-fix.yml
          git commit -m "Remove one-time archived customers fix workflow"
          git push
