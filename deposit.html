<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sathi Pay - Deposit</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e5e7eb;
        }

        .pending {
            color: #b45309;
            font-weight: bold;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }

        .failed {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">

        <h2>Sathi Pay - Deposit</h2>

        <a href="agents.html">Agents</a>

    </div>


    <div class="container">


        <!-- NEW DEPOSIT -->

        <div class="card">

            <h2>New Deposit</h2>

            <form onsubmit="submitDeposit(event)">

                <label>Select Agent</label>

                <select id="depositAgent" required>

                    <option value="">
                        Loading agents...
                    </option>

                </select>


                <label>Amount (₹)</label>

                <input
                    type="number"
                    id="depositAmount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >


                <button type="submit">
                    Submit Deposit
                </button>


                <div id="message"></div>

            </form>

        </div>



        <!-- DEPOSIT HISTORY -->

        <div class="card">

            <h2>Deposit History</h2>

            <div class="table-box">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Agent</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="depositTable">

                        <tr>

                            <td colspan="4">
                                Loading deposits...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- APP.JS -->

    <script src="js/app.js"></script>


    <script>

        // ==============================
        // LOAD ALL AGENTS
        // ==============================

        async function loadDepositAgents() {

            const select =
                document.getElementById("depositAgent");

            select.innerHTML =
                '<option value="">Loading agents...</option>';


            const { data, error } =
                await supabaseClient
                    .from("agents")
                    .select("id, name, mobile, status")
                    .order("name");


            console.log("Agents:", data);
            console.log("Agent error:", error);


            if (error) {

                console.error(error);

                select.innerHTML =
                    '<option value="">Error loading agents</option>';

                return;
            }


            if (!data || data.length === 0) {

                select.innerHTML =
                    '<option value="">No agents found</option>';

                return;
            }


            select.innerHTML =
                '<option value="">Select Agent</option>';


            data.forEach(function(agent) {

                const option =
                    document.createElement("option");

                option.value =
                    agent.id;

                option.textContent =
                    agent.name + " - " + agent.mobile;

                select.appendChild(option);

            });

        }



        // ==============================
        // SUBMIT DEPOSIT
        // ==============================

        async function submitDeposit(event) {

            event.preventDefault();


            const agentId =
                document.getElementById("depositAgent").value;


            const amount =
                document.getElementById("depositAmount").value;


            const message =
                document.getElementById("message");


            message.innerText = "";


            if (!agentId) {

                message.innerText =
                    "Please select an agent.";

                return;

            }


            if (!amount || Number(amount) <= 0) {

                message.innerText =
                    "Please enter a valid amount.";

                return;

            }


            message.innerText =
                "Submitting deposit...";


            const { error } =
                await supabaseClient
                    .from("deposits")
                    .insert([
                        {
                            agent_id: agentId,
                            amount: Number(amount),
                            status: "Pending"
                        }
                    ]);


            if (error) {

                console.error(error);

                message.innerText =
                    "Error: " + error.message;

                return;

            }


            message.innerText =
                "Deposit submitted successfully!";


            document.getElementById(
                "depositAmount"
            ).value = "";


            await loadDeposits();

        }



        // ==============================
        // LOAD DEPOSIT HISTORY
        // ==============================

        async function loadDeposits() {

            const table =
                document.getElementById("depositTable");


            const { data, error } =
                await supabaseClient
                    .from("deposits")
                    .select(`
                        id,
                        amount,
                        status,
                        agents (
                            name
                        )
                    `)
                    .order("id", {
                        ascending: false
                    });


            if (error) {

                console.error(error);

                table.innerHTML = `

                    <tr>

                        <td colspan="4">
                            Error loading deposits
                        </td>

                    </tr>

                `;

                return;

            }


            if (!data || data.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td colspan="4">
                            No deposits found
                        </td>

                    </tr>

                `;

                return;

            }


            table.innerHTML = "";


            data.forEach(function(deposit) {

                const agentName =
                    deposit.agents
                        ? deposit.agents.name
                        : "Unknown";


                let statusClass = "pending";


                if (
                    deposit.status &&
                    deposit.status.toLowerCase() === "approved"
                ) {

                    statusClass = "success";

                }


                if (
                    deposit.status &&
                    deposit.status.toLowerCase() === "failed"
                ) {

                    statusClass = "failed";

                }


                table.innerHTML += `

                    <tr>

                        <td>
                            ${deposit.id}
                        </td>

                        <td>
                            ${agentName}
                        </td>

                        <td>
                            ₹${deposit.amount}
                        </td>

                        <td class="${statusClass}">
                            ${deposit.status}
                        </td>

                    </tr>

                `;

            });

        }



        // ==============================
        // START
        // ==============================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadDepositAgents();

                loadDeposits();

            }
        );

    </script>

</body>
</html>
